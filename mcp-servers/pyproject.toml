[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plugins-mx-mcp-servers"
version = "0.1.0"
description = "MCP servers for plugins-mx monorepo (México operativo agéntico)"
requires-python = ">=3.10"
authors = [{ name = "Elías Rashid Morales Mendoza", email = "elimoralsmendox@gmail.com" }]
license = { text = "Proprietary" }
readme = "README.md"

dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "respx>=0.21,<1.0",
    "cryptography>=42,<46",
]
# Login e.firma por httpx a los portales SAT (CSF, padrón, opinión 32-D propia)
sat-portal = [
    "cryptography>=42,<46",
]
sat-playwright = [
    "cryptography>=42,<46",
    "playwright>=1.42,<2.0",
    "playwright-stealth>=2.0,<3.0",
]
# WS Descarga Masiva SAT (firma XMLDSig con e.firma): solo cryptography.
sat-ws = [
    "cryptography>=42,<46",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "mp_*"]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "mp_*/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "live: golpea el portal/API real; se salta salvo PLUGINS_MX_LIVE=1",
]
pythonpath = ["."]
