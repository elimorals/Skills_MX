[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plugins-mx-mcp-servers"
version = "0.1.0"
description = "MCP servers for plugins-mx monorepo (México operativo agéntico)"
requires-python = ">=3.10"
authors = [{ name = "Elías Rashid Morales Mendoza", email = "elimoralsmendox@gmail.com" }]
license = { text = "Proprietary" }
readme = "README.md"

dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "respx>=0.21,<1.0",
    "cryptography>=42,<46",
]
# Grupo D (federales públicos 2): RETyS/CONAMER y check_form_render van detrás de Akamai
# y solo responden a un navegador real.
publicos-federales-2 = [
    "playwright>=1.42,<2.0",
    "pypdf>=4,<6",
]
sat-playwright = [
    "cryptography>=42,<46",
    "playwright>=1.42,<2.0",
    "playwright-stealth>=2.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "mp_*"]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "mp_*/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "live: golpea el portal/API real; se salta salvo PLUGINS_MX_LIVE=1",
]
pythonpath = ["."]
