              - list [ref=e108]:
                - listitem [ref=e109]: El presente Programa de Verificación Vehicular tiene como objetivo evaluar los niveles de emisiones contaminantes provenientes del escape de los vehículos automotores en circulación que usan gasolina, gas, diésel o cualquier otro combustible alterno que cuenten con placas del Estado de México o que circulen en la entidad, conforme a lo establecido en las Normas Oficiales Mexicanas, Normas Técnicas Estatales Ambientales y la normatividad ambiental aplicable en materia de verificación vehicular. Así como establecer los mecanismos que coadyuven en la prevención, control y disminución de emisiones contaminantes a la atmósfera.
