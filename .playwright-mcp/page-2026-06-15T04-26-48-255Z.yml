    - generic [ref=e130]:
      - heading "Glosario" [level=3] [ref=e131]
      - separator [ref=e132]
      - strong [ref=e133]: "Autoridades:"
      - text: A la Secretaría de Hacienda y Crédito Público, la CNBV, la Comisión Nacional de Seguros y Fianzas, y la Comisión Nacional del Sistema de Ahorro para el Retiro;
      - strong [ref=e134]: "CASFIM:"
      - text: Al Catálogo del Sistema Financiero Mexicano, que tiene a su cargo la Secretaría de Hacienda y Crédito Público;
      - strong [ref=e135]: "Clave Institucional:"
      - text: Al medio de identificación electrónica y contraseña proporcionada a la Institución Financiera por la Comisión Nacional, que sirve de acceso al Portal del SIPRES;
      - strong [ref=e136]: "Clave de Registro:"
      - text: Al número de identificación asignado a la Institución Financiera por el CASFIM o la Comisión Nacional;
      - strong [ref=e137]: "Comisión Nacional:"
      - text: A la Comisión Nacional para la Protección y Defensa de los Usuarios de Servicios Financieros;
      - strong [ref=e138]: "CNBV:"
      - text: A la Comisión Nacional Bancaria y de Valores;
      - strong [ref=e139]: "Unidad de Atención a Usuarios:"
      - text: A la unidad administrativa desconcentrada de la Comisión Nacional, ya sea regional, estatal o local;
      - strong [ref=e140]: "Días hábiles:"
      - text: A los establecidos en el acuerdo que cada año publica la Comisión Nacional, en el Diario Oficial de la Federación, donde se señalan los días en que cerrará sus puertas y suspenderá operaciones;
      - strong [ref=e141]: "Dictamen Técnico:"
      - text: Al emitido por la CNBV a las SOFOM E.N.R., en materia de prevención, detección y reporte de actos, omisiones u operaciones que pudiesen vincularse con terrorismo, terrorismo internacional u operaciones con recursos de procedencia ilícita;
      - strong [ref=e142]: "Estatus:"
      - text: A la situación jurídico administrativa que refleja la condición actual de la Institución Financiera;
      - strong [ref=e143]: "Folio:"
      - text: Al número electrónico que identifica una solicitud de opinión de estatutos para constituir una SOFOM, o para renovar su registro;
      - strong [ref=e144]: "Institución Financiera:"
      - text: A las instituciones mencionadas en el artículo 2, fracción IV, de la Ley;
      - strong [ref=e145]: "Ley:"
      - text: A la Ley de Protección y Defensa al Usuario de Servicios Financieros;
      - strong [ref=e146]: "LGOAAC:"
      - text: A la Ley General de Organizaciones y Actividades Auxiliares del Crédito;
      - strong [ref=e147]: "Manual:"
      - text: Al Manual para actualizar, completar y validar información en el SIPRES;
      - strong [ref=e148]: "Opinión Desfavorable:"
      - text: A la respuesta electrónica que emite la Comisión Nacional cuando un proyecto de estatutos sociales para constituir una SOFOM debe ser corregido o modificado;
      - strong [ref=e149]: "Opinión Favorable:"
      - text: A la respuesta electrónica que emite la Comisión Nacional cuando un proyecto de estatutos sociales para constituir una SOFOM ha sido autorizado;
      - strong [ref=e150]: "Período de Validación:"
      - text: A los primeros diez días hábiles de los meses de enero, abril, julio y octubre de cada año;
      - strong [ref=e151]: "Portal de Registro:"
      - text: A la herramienta electrónica dentro del portal del SIPRES que la Comisión Nacional pone a disposición de las SOFOM para su registro;
      - strong [ref=e152]: "Portal del SIPRES:"
      - text: A la herramienta informática que la Comisión Nacional, a través de su página electrónica, pone a disposición de las Instituciones Financieras, para que capturen su información y la mantengan actualizada;
      - strong [ref=e153]: "Promovente:"
      - text: A la persona interesada en constituir una SOFOM;
      - strong [ref=e154]: "SIPRES:"
      - text: Al Registro de Prestadores de Servicios Financieros a cargo de la Comisión Nacional;
      - strong [ref=e155]: "SOFOM:"
      - text: A la Sociedad Financiera de Objeto Múltiple, la cual podrá ser entidad regulada o entidad no regulada, de conformidad con lo establecido en la LGOAAC;
      - strong [ref=e156]: "Titular de la Clave Institucional:"
      - text: Al representante legal de la Institución Financiera a quien le fue otorgada la Clave Institucional, y
      - strong [ref=e157]: "Usuario:"
      - text: En singular o plural a la persona que contrata, utiliza o por cualquier otra causa tenga algún derecho frente a la Institución Financiera como resultado de la operación o servicio prestado.
    - generic [ref=e158]:
      - heading "Unes" [level=3] [ref=e159]
      - separator [ref=e160]
      - strong [ref=e161]: Conoce las Unidades Especializadas de Atención a Usuarios (UNES) de las Instituciones Financieras
