    - generic [ref=e54]:
      - heading "¿Qué es el SIPRES?" [level=3] [ref=e55]
      - separator [ref=e56]
      - generic [ref=e57]:
        - text: Es un registro de carácter público creado por ministerio de ley (Ley de Protección y Defensa al Usuario de Servicios Financieros), cuyo objetivo principal consiste en proporcionar información corporativa y general de las instituciones financieras que son competencia de la CONDUSEF.
        - text: Permite conocer al público en general información relativa a las instituciones financieras tales como su domicilio, estatus (situación jurídico administrativa), capital mínimo fijo, etc., datos todos que representan la información mínima que se requiere conocer de cada institución financiera para el efecto de su contratación.
        - text: "Si la Institución que buscas no se encuentra en este Registro se debe a:"
      - list [ref=e58]:
        - listitem [ref=e59]: No se trata de una Institución Financiera o,
        - listitem [ref=e60]: está incumpliendo con la normatividad aplicable.
      - paragraph [ref=e61]: ¿Cuáles son los objetivos del Registro?
      - list [ref=e62]:
        - listitem [ref=e63]: Ubicar las instituciones financieras que podrán ser llamadas a un procedimiento conciliatorio dentro de la CONDUSEF derivado de una reclamación formal presentada por algún usuario de servicios financieros.
        - listitem [ref=e64]: Contar con mejores estrategias de orientación y asesoría para los usuarios.
        - listitem [ref=e65]: Contribuir al fomento de la cultura financiera y el sano desarrollo del Sistema Financiero Nacional.
    - generic [ref=e66]:
      - heading "Marco Legal" [level=3] [ref=e67]
      - separator [ref=e68]
      - list [ref=e69]:
        - listitem [ref=e70]:
          - text: Ley de Protección y Defensa al Usuario de Servicios Financieros.
          - generic [ref=e71]:
            - strong [ref=e72]: Artículo 2o.-
            - text: "Para los efectos de esta Ley, se entiende por:"
            - text: "- - -"
            - paragraph [ref=e73]:
              - strong [ref=e74]: IV.
              - text: Institución Financiera, en singular o plural, a las sociedades controladoras, instituciones de crédito, sociedades financieras de objeto múltiple, sociedades de información crediticia, casas de bolsa, fondos de inversión, almacenes generales de depósito, uniones de crédito, casas de cambio, instituciones de seguros, sociedades mutualistas de seguros, instituciones de fianzas, administradoras de fondos para el retiro, PENSIONISSSTE, empresas operadoras de la base de datos nacional del sistema de ahorro para el retiro, Instituto del Fondo Nacional para el Consumo de los Trabajadores, sociedades cooperativas de ahorro y préstamo, sociedades financieras populares, sociedades financieras comunitarias, las instituciones de tecnología financiera, y cualquiera otra sociedad que requiera de la autorización de la Secretaría de Hacienda y Crédito Público o de cualesquiera de las Comisiones Nacionales para constituirse y funcionar como tales y ofrecer un producto o servicio financiero a los Usuarios.
            - paragraph [ref=e75]:
              - strong [ref=e76]: Artículo 8o.-
              - text: La Comisión Nacional, con la información que le proporcionen las autoridades competentes y las Instituciones Financieras, establecerá y mantendrá actualizado un Registro de Prestadores de Servicios Financieros, en los términos y condiciones que señala esta Ley. Lo anterior, sin perjuicio de los demás registros que corresponda llevar a otras autoridades.
            - paragraph
            - paragraph [ref=e77]:
              - strong [ref=e78]: Artículo 46.-
              - text: La Comisión Nacional tendrá a su cargo el Registro de Prestadores de Servicios Financieros, cuya organización y funcionamiento se sujetará a las disposiciones que al efecto expida la propia Comisión Nacional.
        - listitem [ref=e79]:
          - link "Disposición en Materia de Registros ante la CONDUSEF." [ref=e80] [cursor=pointer]:
            - /url: https://webapps.condusef.gob.mx/SistRegistro/pdf/DISPOSICIONES_SIPRES.pdf
