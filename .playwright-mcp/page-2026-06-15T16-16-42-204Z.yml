            - paragraph [ref=e1037]: "Para acreditar la legal posesión del vehículo, el usuario deberá exhibir cualquiera de los siguientes documentos: el permiso de importación temporal expedido por la Autoridad competente, la factura, carta factura, pedimento de importación o el título de propiedad del vehículo, así mismo, deberá presentar identificación oficial."
            - paragraph [ref=e1038]:
