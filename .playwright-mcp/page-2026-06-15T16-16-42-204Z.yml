            - paragraph [ref=e1153]:
              - strong [ref=e1154]: E
              - strong [ref=e1155]: "n el caso de los vehículos sancionados dentro del Programa de Vehículos Contaminantes, se deberán presentar los siguientes documentos:"
            - paragraph [ref=e1156]: Para vehículos matriculados en la Ciudad de México, que se encuentren dentro de su periodo de Verificación, deberá presentar el Certificado de Verificación y Holograma vigente, tarjeta de circulación, identificación oficial, boleta de sanción y el pago de la sanción respectiva.
            - paragraph [ref=e1157]: "Para vehículos matriculados en la Ciudad de México, que se encuentren fuera de su periodo de Verificación sin Certificado de Verificación y Holograma vigente, deberán presentar entre otros: la tarjeta de circulación, identificación oficial, boleta de sanción y el pago de la sanción respectiva y la multa por verificación extemporánea correspondiente."
            - paragraph [ref=e1158]: Para vehículos matriculados en una Entidad Federativa distinta a la Ciudad de México o que porten placas Federales, deberán presentar la tarjeta de circulación, identificación oficial, boleta sanción y pago de la sanción respectiva.
            - paragraph [ref=e1159]: Para vehículos matriculados en las demás Entidades Federativas que conforman la Megalópolis, deberán presentar la tarjeta de circulación, identificación oficial, boleta de sanción y pago de la sanción correspondiente.
            - paragraph [ref=e1160]: En el caso de las verificaciones voluntarias se deberá presentar tarjeta de circulación o, en el caso de unidades matriculadas en el extranjero, documento de ingreso al país.
            - paragraph [ref=e1161]: En caso de no contar con tarjeta de circulación, una o ambas placas por robo extravío, se deberán presentar los documentos señalados en los numerales 9.2. y 9.3.1. del presente programa.
            - paragraph [ref=e1162]: Aquellos vehículos con número de matrícula ya asignada, que no cuenten son las placas físicas, deberán portar el documento emitido por la dependencia correspondiente, mediante el cual se observe dicha asignación y vigencia del documento, estar colocado en un lugar visible del vehículo y adjuntar copia del mismo al expediente de verificación.
            - paragraph [ref=e1163]:
              - text: En el caso de vehículos a los que se les haya cambiado la matrícula, previamente registrados en la Ciudad de México, con verificación previa en esta entidad, se deberá presentar la tarjeta de circulación, así como la solicitud y/o el pago de la baja. En aquellos casos que, de acuerdo con las fechas de la última verificación y el alta vehicular, se observe que los periodos para verificar la unidad se encuentran vigentes, no será necesario solicitar la baja o el pago de la baja de la placa anterior.
              - text: En caso de baja de una matrícula por sustitución del vehículo, como es el caso del servicio público de pasajeros (incluidos taxis), se deberá presentar la tarjeta de circulación, así como el documento oficial que acredite dicha sustitución.
            - paragraph [ref=e1164]: Los vehículos que hubiesen obtenido un oficio vigente para la ampliación al período de verificación emitido por la Secretaría, o presenten el pago de multa por verificación extemporánea realizada por cualquier medio vigente o copia certificada del pago emitida por la Secretaría de Administración y Finanzas de la Ciudad de México, estarán exentos de las restricciones establecidas en el Programa Hoy No Circula y en el Programa para Prevenir y Responder a Contingencias Ambientales Atmosféricas en la Ciudad de México, solamente cuando circulen con dirección a un Centro de Verificación de Emisiones Vehiculares con el objetivo de verificar las emisiones de su vehículo, siempre y cuando lleven consigo el original y una copia del documento correspondiente y hayan obtenido una cita, esta última deberá portarse en medio impreso o electrónico.
            - paragraph [ref=e1165]:
              - text: Es obligación del personal del
              - strong [ref=e1166]: Centro de Verificación
              - strong [ref=e1167]: de Emisiones
              - strong [ref=e1168]: Vehicular
              - strong [ref=e1169]: es
              - text: adhiera la Constancia de Verificación tipo “0”, “1”, “2” o el incentivo “00, según le corresponda, al vehículo en la parte superior derecha del parabrisas del vehículo y, en caso de tener franja entintada superior, el holograma deberá colocarse debajo de esta (lo más arriba posible) y quedará libre de obstáculos que impidan su identificación, salvo cuando la unidad sea blindada, en cuyo caso se adherirá a una mica o cristal, misma que se le entregará al conductor de la unidad. En caso de rechazo se emitirá la constancia respectiva.
            - paragraph [ref=e1170]:
              - text: Permitir retirar y destruir obligatoriamente todos los hologramas anteriores al obtenido, así como los residuos de hologramas anteriores, para no obstaculizar la identificación del holograma vigente (salvo en el caso de la constancia de rechazo, por no obtener el holograma y mantendrán los beneficios a la circulación de acuerdo al tipo de holograma que hayan obtenido continuando con su vigencia en tanto obtengan un resultado aprobatorio dentro del plazo que corresponda). El personal del
              - strong [ref=e1171]: Centro de Verificación
              - strong [ref=e1172]: de Emisiones
              - strong [ref=e1173]: Vehicular
              - strong [ref=e1174]: es
              - text: deberá retirar obligatoriamente sin costo alguno todos los hologramas anteriores adheridos en el cristal delantero de la unidad y no colocará el nuevo holograma hasta que se hayan retirado y destruido los hologramas anteriores.
            - paragraph [ref=e1175]: Tramitar la reposición del certificado de la constancia de verificación y/u holograma de aprobación de la verificación en caso de pérdida, robo o destrucción, conforme a lo establecido en el numeral 19.1.5 del presente programa.
            - paragraph [ref=e1176]: "En caso de no contar con el certificado, se deberá solicitar una copia del mismo en el Verificentro en el que realizó la verificación de emisiones inmediata anterior conforme a la tarifa señalada en el numeral 7.5 del presente programa. Para emitir dicha copia, el personal autorizado por el Verificentro deberá asentar en la misma: el nombre, la firma, la clave única de verificación contenida en su credencial, así como el sello del Verificentro."
            - paragraph [ref=e1177]:
              - text: Para el caso de los vehículos que se presenten en cualquier
              - strong [ref=e1178]: Centro de Verificación de Emisiones Vehiculares
              - text: a realizar la prueba de verificación correspondiente y no cuenten con holograma o certificado de verificación anterior, podrán ser verificados sin necesidad de tramitar la reposición del certificado y holograma siempre y cuando el sistema de verificación vehicular de la Ciudad de México, presente en la pantalla el registro de la verificación vehicular de su período inmediato anterior, para tal caso los Centros de Verificación de Emisiones Vehiculares deberán realizar y anexar al expediente la consulta. En el caso de no contar con el holograma se deberá, exhibir original y copia para cotejo del acta levantada ante la Agencia del Ministerio Público o Fiscalía o Juez Cívico. Se aceptarán actas generadas por mecanismos digitales y generados en las oficinas de Agencia del Ministerio Público o Fiscalía correspondiente y/o Juez Cívico.
            - separator [ref=e1179]
            - paragraph [ref=e1180]
            - paragraph [ref=e1181]:
              - strong [ref=e1182]: VERIFICACIÓN EXTEMPORÁNEA
            - paragraph [ref=e1183]:
              - text: "Los vehículos que sean llevados a verificar sus emisiones en el primer semestre de 2026 y que no hayan aprobado la verificación en el período de tiempo correspondiente, deberán pagar una multa por verificación vehicular extemporánea, de acuerdo con lo siguiente:"
              - text: Pagar una multa por verificación vehicular extemporánea por 20 veces la Unidad de Medida y Actualización vigente. La vigencia del pago de la multa es de 30 días naturales contados a partir del día siguiente a la realización del pago de la misma, siendo el tiempo que se tiene para poder realizar y aprobar la verificación vehicular del automotor. El pago de la multa no exime a los vehículos de respetar las limitaciones a la circulación establecidas en el Programa Hoy No Circula y en el Programa para Prevenir y Responder a Contingencias Ambientales Atmosféricas, salvo en el caso, que se traslade al
              - strong [ref=e1184]: Centro de Verificación de Emisiones Vehiculares
              - text: ", con una cita vigente para verificar en el día en cuestión, conforme el numeral 9.3.10 del presente."
            - paragraph [ref=e1185]: En caso de no obtener una constancia de verificación aprobatoria en los 30 días de la vigencia del pago de la multa de Verificación extemporánea, se deberán pagar las multas por verificación vehicular extemporánea que amparen el monto de 40 veces la Unidad de Medida y Actualización vigente, con lo cual se adquiere un nuevo plazo de 30 días naturales para aprobar la verificación de emisiones vehiculares.
            - paragraph [ref=e1186]: En caso de no obtener una constancia de verificación aprobatoria en los 30 días de la vigencia del pago de la multa establecida en el párrafo anterior, se deberán pagar las multas por verificación vehicular extemporánea que amparen el monto de 80 veces la Unidad de Medida y Actualización vigente, con lo cual se adquiere un nuevo plazo de 30 días naturales para aprobar la verificación vehicular. Si el plazo para verificar se vence nuevamente sin que la unidad hubiese aprobado la verificación, se deberá repetir este mecanismo tantas veces sea necesario, hasta que la unidad apruebe la verificación vehicular.
            - paragraph [ref=e1187]
            - paragraph [ref=e1188]:
              - text: "El procedimiento para realizar la verificación vehicular de unidades con multa por verificación extemporánea es el siguiente:"
              - text: Obtener una línea de captura para el pago de la multa por verificación extemporánea, la cual se obtiene en el portal oficial de Internet de la Secretaría de Administración y Finanzas de la Ciudad de México (
              - strong:
                - link:
                  - /url: https://data.finanzas.cdmx.gob.mx/formato_lc/ambiente/50
              - link "https://data.finanzas.cdmx.gob.mx/formato_lc/ambiente/50" [ref=e1189] [cursor=pointer]:
                - /url: https://data.finanzas.cdmx.gob.mx/formato_lc/ambiente/50
                - strong [ref=e1190]: https://data.finanzas.cdmx.gob.mx/formato_lc/ambiente/50
              - text: ) o en Locatel en el teléfono 55-56-58-11-11. El Formato Múltiple de Pago a la Tesorería establece, en un recuadro colocado en la parte central inferior del mismo, la vigencia para pagar la línea de captura, misma que no corresponde a la vigencia del pago de la multa por verificación extemporánea.
            - paragraph [ref=e1191]:
              - text: En el supuesto de que el vehículo se presente a verificar sin el original de la línea de captura generada para el pago de multa por verificación extemporánea, se podrá prestar el servicio, siempre y cuando se exhiba el comprobante de pago original realizado por cualquier medio y el personal del Centro de Verificación de Emisiones Vehiculares realice una consulta en el portal de la Secretaría de Administración y Finanzas de la Ciudad de México (
              - strong [ref=e1192]:
                - link "https://data.finanzas.cdmx.gob.mx/consultas_pagos/consulta_pagos" [ref=e1193] [cursor=pointer]:
                  - /url: https://data.finanzas.cdmx.gob.mx/consultas_pagos/consulta_pagos
              - text: ), validando el pago de la misma, imprimiendo y anexando al expediente administrativo la consulta realizada, así como, el comprobante de pago original asentando el nombre y firma de la persona que realizó la consulta y validación.
            - paragraph [ref=e1194]: Realizar el pago de la multa por el número de veces de la Unidad de Medida y Actualización vigente correspondientes, de acuerdo con lo establecido en el presente procedimiento.
            - paragraph [ref=e1195]:
              - text: Llevar su auto a verificar hasta que el pago de la multa por verificación extemporánea se vea reflejado en el Sistema de la Secretaría de Administración y Finanzas de la Ciudad de México (
              - link "https://data.finanzas.cdmx.gob.mx/consultas_pagos/consulta_pagos" [ref=e1196] [cursor=pointer]:
                - /url: https://data.finanzas.cdmx.gob.mx/consultas_pagos/consulta_pagos
                - text: https://
                - strong [ref=e1197]: data.finanzas.cdmx.gob.mx/consultas_pagos/consulta_pagos
              - text: ), en tanto no ocurra la unidad no podrá ser verificada hasta que en el sistema de la Secretaría de Administración y Finanzas de la Ciudad de México que revisa el personal del Verificentro, aparezca como pagada la línea de captura que se presente.
            - paragraph [ref=e1198]:
              - text: Una vez realizado el pago de la multa por verificación extemporánea, el legal poseedor del vehículo deberá trasladar el mismo a un taller mecánico y/o a un
              - strong [ref=e1199]: Centro de Verificación de Emisiones Vehiculares
              - text: (para este último caso con cita), dentro del plazo de 30 días naturales contados a partir del día siguiente a la realización del pago de la misma.
            - paragraph [ref=e1200]:
              - text: Antes de pagar su multa por verificación extemporánea, se deberán asegurar que el vehículo no cuente con adeudos por tenencia, refrendo e infracciones al Reglamento de Tránsito de la Ciudad de México, sanciones aplicadas por incumplimiento al Reglamento de la Ley Ambiental de la Ciudad de México en Materia de Verificación Vehicular, Fotocívicas, o alguna leyenda en cualquiera de los conceptos a validar distinta a las referidas anteriormente que impidan verificar su estatus, con el objeto de evitar que se venza la vigencia del pago de su multa y que tenga la obligación de volver a pagarla.
              - text: Realizar la verificación vehicular, debiendo entregar al usuario, en original, la parte correspondiente al contribuyente del Formato Múltiple de Pago a la Tesorería o copia simple del pago de la multa por verificación extemporánea realizada por cualquier medio vigente o copia certificada del pago emitida por la Secretaría de Administración y Finanzas de la Ciudad de México, utilizada para verificar el vehículo. La constancia de verificación aprobatoria recibida corresponderá al semestre en que se obtenga.
              - text: Quedan exceptuados de la multa por verificación extemporánea, los vehículos candidatos a obtener el incentivo “00” en sus primeros dos años contados a partir de la fecha de la primera enajenación del vehículo.
              - text: Los propietarios o legales poseedores de los vehículos que hayan sido objeto de extemporaneidad y no puedan hacer uso de la línea de captura generada por concepto de multa por verificación extemporánea y pagada con errores de datos, deberán acudir a las oficinas de la Administración Tributaria de la Secretaría de Administración y Finanzas, a solicitar la corrección de la línea de captura, debiendo presentar en el
              - strong [ref=e1201]: Centro de Verificación
              - strong [ref=e1202]: de Emisiones
              - strong [ref=e1203]: Vehicular
              - strong [ref=e1204]: es
              - text: el original del oficio donde se subsanen las inconsistencias, documento con el cual podrá trasladar el vehículo para verificar.
              - text: Los titulares de los
              - strong [ref=e1205]: Centro de Verificación
              - strong [ref=e1206]: de Emisiones
              - strong [ref=e1207]: Vehicular
              - strong [ref=e1208]: es
              - text: deberán anexar al expediente administrativo el oficio donde se subsanen las inconsistencias.
              - text: "Los vehículos que se presenten a verificar con el pago de la multa generada por la verificación vehicular extemporánea cuya referencia de placa, marca o modelo se encuentre incorrecta con la tarjeta de circulación del vehículo, deberán ser verificados siempre y cuando exhiban los siguientes documentos:"
              - strong [ref=e1209]: "1."
              - text: El comprobante de pago original con errores de impresión del semestre correspondiente al que se presenta a verificar.
              - strong [ref=e1210]: "2."
              - text: Volante de aclaraciones con fecha del sello del semestre en curso en el que se presenta a verificar, emitido por cualquier Módulo de la Tesorería de Administración Tributaria, o la Impresión del Sistema (
              - strong [ref=e1211]: SISCOR
              - text: ) donde se indique el valor actual o en su caso el oficio de corrección emitido por las Administraciones Tributarias de la Tesorería de la Ciudad de México.
              - text: El computo de los 30 días naturales para hacer uso de la multa por verificación extemporánea, se renovará a partir de la fecha de obtención de los documentos enunciados en el punto 2 del presente numeral, pudiendo verificar los vehículos presentando el pago de las multas por verificación extemporáneas que con motivo de las hipótesis contempladas en el presente numeral hayan perdido su vigencia.
              - text: "Los propietarios o legales poseedores de los vehículos que hayan sido objeto de extemporaneidad para verificar por falta de actualización oportuna del Portal de Consulta de Adeudos por tenencias, refrendos, infracciones de tránsito y del Reglamento de la Ley Ambiental de la Ciudad de México en Materia de Verificación Vehicular; y sanciones impuestas por la Secretaría de Administración y Finanzas de la Ciudad de México, deberán acudir a realizar su trámite de corrección o aclaración de pagos ante alguna Administración Tributaria o Administración Auxiliar, para expresar en el formato denominado “volante de aclaraciones” o en escrito libre, el motivo del trámite de corrección o aclaración de pagos, debiendo presentar en original y copia los siguientes documentos:"
              - strong [ref=e1212]: a)
              - text: El pago sujeto a aclaración o corrección.
              - strong [ref=e1213]: b)
              - text: Tarjeta de circulación.
              - strong [ref=e1214]: c)
              - text: Identificación del contribuyente (en caso de representación, el documento con el que se acredite personalidad).
              - text: Una vez obtenida la consulta de la Secretaría de Administración y Finanzas que muestre la leyenda “Permitir Verificar sin multa de verificación extemporánea”, se deberá presentar en el
              - strong [ref=e1215]: Centro de Verificación
              - strong [ref=e1216]: de Emisiones
              - strong [ref=e1217]: Vehicular
              - strong [ref=e1218]: es
              - text: el original de la consulta, documento con el cual podrá trasladar el vehículo para verificar el día de su cita.
              - text: Los titulares de los centros de verificación vehicular deberán anexar al expediente administrativo la consulta que muestre la leyenda “Permitir Verificar sin multa de verificación extemporánea”.
            - paragraph [ref=e1219]
            - separator [ref=e1220]
            - paragraph [ref=e1221]:
              - strong [ref=e1222]: VERIFICACIÓN DE VEHÍCULOS MATRICULADOS FUERA DE LA CIUDAD DE MÉXICO
            - paragraph [ref=e1223]:
              - text: Las fuentes móviles o vehículos de otras Entidades Federativas, exceptuando vehículos automotores matriculados en el Estado de México, así como los que cuenten con placas Federales y del Extranjero, podrán obtener un holograma mediante la verificación vehicular voluntaria de acuerdo con los lineamientos establecidos en el presente programa, con el objeto de exentar algunas o todas las limitaciones a la circulación establecidas en los programas ambientales de la Ciudad de México. La obtención de un holograma en el programa de la Ciudad de México no exime al automotor del cumplimiento del programa de verificación vehicular que exista en la entidad federativa en la que se encuentre matriculado.
              - text: La verificación voluntaria podrá realizarse en cualquier momento de la vigencia del presente programa, en cualquiera de los Verificentros autorizados de la Ciudad de México, y para cualquier constancia, debiendo presentar los documentos establecidos en el presente programa.
              - text: Para mayor comodidad del usuario del servicio, podrá generar una cita vía telefónica por el
              - strong [ref=e1224]: Centro de Verificación
              - strong [ref=e1225]: de Emisiones
              - strong [ref=e1226]: Vehicular
              - strong [ref=e1227]: es
              - text: "o por Internet en la siguiente liga:"
              - link "citasverificentros.cdmx.gob.mx/" [ref=e1228] [cursor=pointer]:
                - /url: https://citasverificentros.cdmx.gob.mx/
                - strong [ref=e1229]: citasverificentros.cdmx.gob.mx/
              - text: La vigencia de los hologramas obtenidos voluntariamente será contada a partir de la fecha de emisión de los mismos.
              - text: Los vehículos verificados voluntariamente que, por sus emisiones hubiesen obtenido un holograma de menor beneficio al que puedan obtener, podrán verificar tantas veces como sea necesario hasta obtener el holograma deseado, previa cancelación y retiro del holograma en el Verificentro que lo emitió, si dicha verificación tiene menos de 150 días naturales contados a partir de su emisión, pagando la tarifa correspondiente tantas veces como el servicio de verificación de emisiones sea solicitado.
              - text: "Los certificados de verificación de emisiones vehiculares que sean generados bajo la aplicación de una verificación vehicular voluntaria deberán ser sellados en la parte trasera, con la siguiente leyenda: “Este certificado no exenta al presente vehículo del cumplimiento de la verificación de emisiones vehiculares establecida en su Entidad Federativa”."
            - paragraph [ref=e1230]
            - separator [ref=e1231]
            - paragraph [ref=e1232]:
              - strong [ref=e1233]: PRESTACIÓN DEL SERVICIO DE VERIFICACIÓN VEHICULAR
            - paragraph [ref=e1234]:
              - text: Todos los
              - strong [ref=e1235]: Centro de Verificación
              - strong [ref=e1236]: de Emisiones
              - strong [ref=e1237]: Vehicular
              - strong [ref=e1238]: es
              - text: cuentan con la infraestructura necesaria para evaluar las emisiones vehiculares de los vehículos que utilizan gasolina, gas natural, gas licuado de petróleo y otros combustibles alternos, de acuerdo con lo que establece en las Normas Oficiales Mexicanas y el presente programa.
            - paragraph [ref=e1239]:
              - text: Sólo algunos
              - strong [ref=e1240]: Centros de Verificación
              - strong [ref=e1241]: de Emisiones
              - strong [ref=e1242]: Vehicular
              - strong [ref=e1243]: es
              - text: "tienen el equipamiento para evaluar las emisiones generadas por automotores a diésel, por lo que se deberá revisar en el link de la página oficial de Internet de la Secretaría, la información sobre la dirección y el tipo de automotores que cada Verificentro de la Ciudad de México puede verificar:"
              - link "citasverificentros.cdmx.gob.mx/" [ref=e1244] [cursor=pointer]:
                - /url: https://citasverificentros.cdmx.gob.mx/
                - strong [ref=e1245]: citasverificentros.cdmx.gob.mx/
            - paragraph [ref=e1246]: El servicio de verificación vehicular se deberá prestar de lunes a sábado, en el horario comprendido de las 8:00 a las 20:00 horas, este horario podrá modificarse conforme lo que indique el Aviso por el que se da a conocer el Manual para la operación y funcionamiento de los Equipos, Instrumentos, Instalaciones y demás elementos necesarios para la adecuada operación y funcionamiento de los Equipos y Sistemas de Verificación Vehicular, lo cual no impide que se suspenda el servicio solamente los días no laborables conforme a la legislación laboral, situación que deberá hacerse por escrito del conocimiento de la Secretaría, y de los usuarios con un aviso pegado al exterior del Verificentro, por lo menos con un día hábil de anticipación.
            - paragraph [ref=e1247]: La prestación de servicio podrá ser modificado en sus días y sus horarios conforme a las necesidades que así lo requieran, en todos casos, la Secretaría hará del conocimiento de los Centros de Verificación Vehicular, así como al público usuario.
            - paragraph [ref=e1248]:
              - text: No se encuentra autorizado el uso de software, accesorios o equipos electrónicos que no formen parte de los equipos y/o aditamentos autorizados por la Secretaría; así mismo, no se deberán realizar reparaciones mecánicas y/o eléctricas y/o pre - verificaciones al interior del
              - strong [ref=e1249]: Centro de Verificación de Emisiones Vehiculares
              - text: de igual manera, no se verificarán vehículos que tengan dispositivos o equipos electrónicos intermedios conectados que impidan la realización de las pruebas de verificación. El personal que labora en dicho Centro de Verificación de Emisiones Vehiculares será el responsable de reportar al Gerente y Supervisor cuando identifiquen dichas actividades para que a su vez notifiquen al Centro de Inspección y Vigilancia Ambiental Remota (
              - strong [ref=e1250]: CIVAR
              - text: ) al número telefónico 55-9689-5009 extensión 5000 y/o al correo de
              - strong [ref=e1251]: avisos.civar@gmail.com.mx.
            - paragraph [ref=e1252]:
              - text: Durante todo el procedimiento de la prueba de verificación, todos los pasajeros y ocupantes de los vehículos automotores deberán esperar en la zona que para tal efecto se designa en cada
              - strong [ref=e1253]: Centro de Verificación
              - strong [ref=e1254]: de Emisiones
              - strong [ref=e1255]: Vehicular
              - strong [ref=e1256]: es
              - text: . En caso de presentarse con personas vulnerables el personal de atención ciudadana deberá apoyar al usuario para resguardarse en el área destinada para personas vulnerables.
            - paragraph [ref=e1257]:
              - text: En todas sus etapas la prueba deberá aplicarse con los accesorios del vehículo apagados (aire acondicionado, equipo de sonido, centro de entretenimiento, geoposicionador y luces), salvo en el caso de los automotores que, por diseño de fabricación, presentan faros que no pueden ser apagados. Asimismo, para realizar la prueba, el personal técnico del
              - strong [ref=e1258]: Centro de Verificación
              - strong [ref=e1259]: de Emisiones
              - strong [ref=e1260]: Vehicular
              - strong [ref=e1261]: es
              - text: deberá evitar que se utilice peso adicional al vehículo mediante objetos o personas con el objeto de pretender aumentar la tracción de los neumáticos sobre los rodillos del dinamómetro.
            - paragraph [ref=e1262]: En caso de que se detecte un error en el año modelo del automotor reportado por la Tarjeta de Circulación, prevalecerá el modelo especificado por el número de identificación vehicular “NIV” marcado en la carrocería del vehículo establecido bajo el criterio de año modelo en la Norma Oficial Mexicana NOM-001-SSP Vigente.
            - paragraph [ref=e1263]: Los vehículos sólo podrán ser verificados en sus emisiones vehiculares, siempre y cuando exista el registro de las características tecnológicas de los mismos en la base de datos que utilizan los equipos de la Secretaría o de modelos vehiculares que contiene las especificaciones técnicas y los protocolos de prueba asignados para cada vehículo por la industria automotriz. Lo anterior, para evitar la aplicación de un protocolo de prueba que pudiera dañar alguno de los sistemas que componen al vehículo.
            - paragraph [ref=e1264]:
              - text: Cuando un vehículo no se encuentre registrado en el catalogo vehicular dispuesto en el numeral 3.2 de la NOM-167-SEMARNAT-2017, personal de
              - strong [ref=e1265]: Centro de Verificación de Emisiones Vehiculares
              - text: ", deberá reportarlo ante la"
              - strong [ref=e1266]: Dirección General de Calidad del Aire
              - text: de la Secretaría, mediante la mesa de servicio dispuesta en la red interna, en donde se procederá a buscar la información técnica correspondiente para registrar dicha unidad en el catalogo vehicular.
            - paragraph [ref=e1267]:
              - text: Cuando durante el proceso de Verificación Vehicular, el personal de los
              - strong [ref=e1268]: Centros de Verificación de Emisiones Vehiculares
              - text: presuma que el propietario o poseedor del vehículo en trámite de verificación presente documentación presuntamente apócrifa o falsificada o alterada, deberá notificarlo de inmediato a la
              - strong [ref=e1269]: DGIVA
              - text: para los efectos que conforme a derecho procedan.
            - paragraph [ref=e1270]:
              - text: Los
              - strong [ref=e1271]: Centros de Verificación de Emisiones Vehiculares
              - text: deberán abstenerse de prestar el servicio de verificación a vehículos cuya circulación se encuentre restringida por el programa “Hoy No Circula”, o por el
              - strong [ref=e1272]: Programa para Prevenir y Responder a Contingencias Ambientales Atmosféricas
              - text: ", salvo los casos señalados en el numeral 9.3.10."
            - paragraph [ref=e1273]:
              - text: Los
              - strong [ref=e1274]: Centros de Verificación de Emisiones Vehiculares
              - text: deberán validar la información que se desprende del código QR de los vehículos que hubiesen obtenido un Pase Turístico Metropolitano o Pase Turístico Paisano, permiso por discapacidad, oficio vigente para la ampliación al período de verificación emitido por la Secretaría.
            - paragraph [ref=e1275]
            - separator [ref=e1276]
            - paragraph [ref=e1277]:
              - strong [ref=e1278]: DISPOSICIONES COMPLEMENTARIAS DEL PROGRAMA “HOY NO CIRCULA”
            - paragraph [ref=e1279]:
              - text: DISPOSICIONES COMPLEMENTARIAS DEL PROGRAMA “HOY NO CIRCULA”
              - text: "Además de lo establecido en el numeral VII del Programa Hoy No Circula se encuentran exentos de las limitaciones los siguientes supuestos:"
              - strong [ref=e1280]: I.-
              - text: Tractores agrícolas.
              - strong [ref=e1281]: II.-
              - text: Maquinaria dedicada a las industrias de la construcción y minera.
              - strong [ref=e1282]: III.-
              - text: Motocicletas.
              - strong [ref=e1283]: IV.-
              - text: Vehículos con peso bruto vehicular menor o igual a 400 kilogramos.
              - strong [ref=e1284]: V.-
              - text: Vehículos eléctricos.
              - strong [ref=e1285]: VI.-
              - text: Vehículos híbridos categoría I y II con motores de propulsión a gasolina y eléctrico.
              - strong [ref=e1286]: VII.-
              - text: Vehículos con matrícula de auto antiguo y/o clásico.
              - strong [ref=e1287]: VIII.-
              - text: Automotores con matrícula de demostración y/o traslado.
              - strong [ref=e1288]: IX.-
              - text: Vehículos cuya tecnología impida la aplicación de la Norma Oficial Mexicana correspondiente.
              - strong [ref=e1289]: X.-
              - text: Vehículos que porten Holograma “EXENTO”.
              - strong [ref=e1290]: XI.-
              - text: Vehículos que porten Constancia de Verificación y holograma tipo “00” por dos años salvo cuando exista contingencia ambiental atmosférica por contaminantes y la
              - strong [ref=e1291]: CAMe
              - text: emita restricciones a la circulación para alguno de los casos referidos.
              - strong [ref=e1292]: XII.-
              - text: Vehículos que porten Constancia de Verificación y holograma tipo “0”, por seis meses salvo cuando exista contingencia ambiental atmosférica por contaminantes y la
              - strong [ref=e1293]: CAMe
              - text: emita restricciones a la circulación para alguno de los casos referidos.
              - strong [ref=e1294]: XIII.-
              - text: Vehículos que porten Constancia tipo “Permiso Especial para Circular”, siempre y cuando transporten a personas con discapacidad, sin importar la constancia de verificación vehicular que obtenga en el cumplimiento del Programa de Verificación Vehicular.
            - paragraph [ref=e1295]:
              - strong [ref=e1296]: XIV.-
              - text: Vehículos que porten Constancia tipo "Autorregulación”, que participen en el Programa de Autorregulación Ambiental de vehículos a diésel o para impulsar la electromovilidad en vehículos ligeros.
            - paragraph [ref=e1297]:
              - strong [ref=e1298]: XV.-
              - text: Vehículos que porten placas para personas con discapacidad, sin importar la constancia de verificación vehicular que obtenga en el cumplimiento del Programa de Verificación Vehicular.
              - strong [ref=e1299]: XVI.-
              - text: Vehículos que porten Pase Turístico Metropolitano,, dos veces por semestre por siete días, una vez por semestre por 14 días, Vehículos que porten Pase Turístico Paisano durante la activación de puentes largos oficiales y durante la activación del Programa Paisano.
              - strong [ref=e1300]: XVII.-
              - text: Vehículos que porten los oficios de Ampliación al Periodo de Verificación Vehicular, en la vigencia establecida en dicho oficio, emitidos por la Secretaría.
            - paragraph [ref=e1301]:
              - strong [ref=e1302]: XVIII.-
              - text: Vehículos que porten en lugar visible oficio emitido por la Secretaría del Medio Ambiente de la Ciudad de México, para exentar las limitaciones a la circulación.
            - paragraph [ref=e1303]:
              - text: "Además de lo establecido en el Programa Hoy No Circula, se encuentran sujetos a las limitaciones a la circulación los:"
              - strong [ref=e1304]: I.-
              - text: Vehículos que porten Constancia de Verificación y holograma tipo “1” limitan su circulación un día entre semana y dos sábados cada mes hasta por seis meses. En el evento que en el mes exista un quinto sábado, los vehículos con esta constancia podrán circular de acuerdo con las condiciones ambientales que se presenten y sean definidas en el programa y/o aviso correspondiente que en su caso dé a conocer la Secretaría o la Comisión Ambiental de la Megalópolis.
              - strong [ref=e1305]: II.-
              - text: Vehículos que porten Constancia de Verificación y holograma tipo “2”, limitan su circulación un día entre semana y todos los sábados del mes, durante la vigencia de su holograma.
              - strong [ref=e1306]: III.-
              - text: Vehículos que porten Permiso para Circular sin placas y sin tarjeta de circulación, serán tratados como si contaran con un certificado y holograma del tipo “2”, por lo que no deberán circular un día entre semana (viernes) y todos los sábados del mes, así como de lunes a jueves de 05:00 a 11:00 horas.
              - strong [ref=e1307]: IV.-
              - text: Vehículos nuevos y usados que no se encuentren matriculados en la Ciudad de México y que no cuenten con alguno de los certificados y hologramas de verificación vehicular emitidos por la Secretaría, Estados que conforman la Megalópolis o que cuenten con convenio de homologación, limitan su circulación como si contaran con un certificado y holograma del tipo “2”, un día entre semana de acuerdo a la terminación de la placa de circulación y todos los sábados del mes, así como de lunes a viernes de 05:00 a 11:00 horas.
            - paragraph [ref=e1308]:
              - strong [ref=e1309]: V.-
              - text: Vehículos nuevos y usados que se encuentren matriculados en la Ciudad de México y que no cuenten con alguno de los certificados y hologramas de verificación vehicular emitidos por la Secretaría (incluidos los que cuenten con Multas por Verificación Extemporánea), limitan su circulación como si contaran con un certificado y holograma del tipo “2”, un día entre semana y todos los sábados del mes.
            - paragraph [ref=e1310]:
              - strong [ref=e1311]: VI.
              - text: "Vehículos de transporte colectivo de pasajeros que cuenten con la autorización correspondiente de la Secretaría de Movilidad de la Ciudad de México en caso de obtener hologramas “1” ó “2” deberán limitar su circulación un día entre semana y un sábado del mes, de acuerdo con la terminación de su placa en un horario de las 10:00 a las 22:00 horas, la limitación a la circulación los días sábado será de la siguiente manera:"
              - text: "- El primer sábado de cada mes, los vehículos con terminación de placas 5 y 6."
              - text: "- El segundo sábado de cada mes, los vehículos con terminación de placas 7 y 8."
              - text: "- El tercer sábado de cada mes, los vehículos con terminación de placas 3 y 4."
              - text: "- El cuarto sábado de cada mes, los vehículos con terminación de placas 1 y 2."
              - text: "- El quinto sábado, en aquellos meses que lo contengan, los vehículos con terminación de placas 9 y 0, o con permisos de circulación que no cuenten con el número de placa pre asignado."
              - text: Las limitaciones a la circulación durante las contingencias ambientales atmosféricas para los vehículos referidos anteriormente se definirán en el programa y/o aviso correspondiente que en su caso dé a conocer la Secretaría o la Comisión Ambiental de la Megalópolis.
              - text: El Gobierno de la Ciudad de México reconoce los hologramas de verificación vehicular Tipo “E”, “00”, “0”, “1” y “2” otorgados por los Estados que integran la Comisión Ambiental de la Megalópolis (Estado de México, Hidalgo, Morelos, Puebla, Querétaro y Tlaxcala), así como por los Estados que cuenten con Convenio de Coordinación con la CDMX vigente (Guanajuato) entregados a vehículos automotores matriculados en dichas entidades, otorgados bajo los mismos criterios definidos en el presente Programa. Vehículos verificados con criterios distintos serán considerados como unidades con holograma “2”
            - paragraph [ref=e1312]: El Gobierno de la Ciudad de México reconoce los hologramas de verificación vehicular Tipo “E", "00", "0", "1" y "2" otorgados por el Gobierno del Estado de México bajo los criterios del presente programa, excepto a los automotores matriculados en la Ciudad de México, bajo pruebas voluntarias de verificación vehicular. No se reconocerán las verificaciones voluntarias otorgadas en Guanajuato, Hidalgo, Michoacán, Morelos, Puebla, Querétaro y Tlaxcala, dichos automotores serán considerados como no verificados.
            - separator [ref=e1313]
            - paragraph [ref=e1314]:
              - strong [ref=e1315]: ANTES DE PAGAR SU MULTA POR VERIFICACIÓN EXTEMPORÁNEA, SE DEBERÁN ASEGURAR QUE EL VEHÍCULO NO CUENTE CON ADEUDOS POR TENENCIA, REFRENDO E INFRACCIONES AL REGLAMENTO DE TRÁNSITO DE LA CIUDAD DE MÉXICO, SANCIONES APLICADAS POR INCUMPLIMIENTO AL REGLAMENTO DE LA LEY AMBIENTAL DE LA CIUDAD DE MÉXICO EN MATERIA DE VERIFICACIÓN VEHICULAR, FOTO – CÍVICAS, O ALGUNA LEYENDA EN CUALQUIERA DE LOS CONCEPTOS A VALIDAR DISTINTA A LAS REFERIDAS ANTERIORMENTE QUE IMPIDAN VERIFICAR SU ESTATUS, CON EL OBJETO DE EVITAR QUE SE VENZA LA VIGENCIA DEL PAGO DE SU MULTA Y QUE TENGA LA OBLIGACIÓN DE VOLVER A PAGARLA.
            - separator [ref=e1316]
            - paragraph [ref=e1317]
            - paragraph [ref=e1318]:
              - strong [ref=e1319]: PROGRAMA DE VEHÍCULOS CONTAMINANTES (PVC)
            - paragraph [ref=e1320]:
              - text: La
              - strong [ref=e1321]: Dirección General de Inspección y Vigilancia Ambiental
              - text: de la Secretaría, está facultada para detectar, detener, inspeccionar y, en su caso, sancionar a los vehículos que circulen en las vialidades de la Ciudad de México y que contravengan las disposiciones de este programa, del Programa Hoy No circula, del Programa para Prevenir y Responder a Contingencias Ambientales Atmosféricas en la Ciudad de México o del Reglamento de la Ley Ambiental de la Ciudad de México en Materia de Verificación Vehicular, sea cual fuere el origen de la placa, así como a los vehículos que no comprueben la verificación vehicular de la entidad en la que se encuentran obligados a cumplir. Para realizar las referidas funciones se consideran hábiles todos los días y horas del año.
            - paragraph [ref=e1322]:
              - text: "En el caso de vehículos sancionados con motivo de la operación del Programa de Vehículos Contaminantes, la sanción será de 20 veces la Unidad de Medida y Actualización y se deberá pagar utilizando el Formato Múltiple de Pago a la Tesorería, que se podrá obtener ingresando en cualquiera de la siguiente dirección electrónica:"
              - strong [ref=e1323]
              - link:
                - /url: https://data.finanzas.cdmx.gob.mx/formato_lc/conceptos/ambiente
              - strong [ref=e1324]:
                - link "data.finanzas.cdmx.gob.mx/formato_lc/conceptos/ambiente/51" [ref=e1325] [cursor=pointer]:
                  - /url: https://data.finanzas.cdmx.gob.mx/formato_lc/conceptos/ambiente/51
              - strong [ref=e1326]: ","
              - text: en donde se debe utilizar la clave 51 para los vehículos sancionados por dicho motivo, tomando como referencia el folio de la boleta de sanción. Con estos elementos se generará la línea de captura que deberá ser pagada en bancos, centros comerciales, en las oficinas de recaudación correspondientes de la Tesorería de la Ciudad de México o en línea.
            - paragraph [ref=e1327]: En los casos que haya sido procedente la imposición de medida cautelar, recoger su placa o placas de circulación en el Módulo de Atención Ciudadana del Programa de Vehículos Contaminantes y Programa de Inspección y Vigilancia a Suelo Urbano de la Secretaría, ubicada en Acceso 1 del Bosque de San Juan de Aragón, Avenida José Loreto Fabela sin número, Colonia San Juan de Aragón, Alcaldía Gustavo A. Madero, Código Postal 07969, Ciudad de México, de lunes a viernes dentro de un horario de 09:00 a 15:00 horas en días hábiles.
            - paragraph [ref=e1328]:
              - strong [ref=e1329]: Requisitos para la Recuperación de Placa
              - strong [ref=e1330]: a)
              - text: Boleta de sanción en original, en caso de extravío o robo deberá levantar acta ante la Agencia del Ministerio Público o la Fiscalía o Juez Cívico competente (incluidas las actas generadas mediante mecanismos digitales) y copia de la misma para su integración en el respectivo expediente.
            - paragraph [ref=e1331]:
              - strong [ref=e1332]: b)
              - text: Tarjeta de circulación vigente y copia de la misma. Si la tarjeta no está actualizada con el nombre del propietario, deberá presentar el documento que acredite la propiedad del vehículo y entregar copia del mismo.
            - paragraph [ref=e1333]:
              - strong [ref=e1334]: c)
              - text: Prueba de Evaluación Técnica (PET) en caso de haber sido sancionado por emisión de humo, y copia de la misma. La Constancia de Prueba de Evaluación Técnica, deberá exhibir el sello de APROBADO y haber sido emitida por un Verificentro de la Ciudad de México.
            - paragraph [ref=e1335]:
              - strong [ref=e1336]: d)
              - text: Formato Múltiple de Pago a la Tesorería de la Ciudad de México con clave 51, con original del recibo y sello del banco o establecimiento donde se realizó el pago de la sanción; o bien, referencia bancaria en el caso de que el pago se haya realizado mediante transferencia o utilizando la aplicación bancaria; o recibo de pago en el supuesto de que se haya realizado en línea o en un Kiosco de la Tesorería de la Ciudad de México. En caso de contar únicamente con imagen, copia de la línea de captura o del comprobante de pago, se requiere original de la certificación de pago realizado ante la Tesorería de la Ciudad de México.
            - paragraph [ref=e1337]:
              - strong [ref=e1338]: e)
              - text: Identificación oficial vigente (pasaporte, cartilla del Servicio Militar Nacional, cédula profesional, identificación para votar vigente o licencia para conducir si fue emitida por el Gobierno de la Ciudad de México) y copia de la misma.
            - paragraph [ref=e1339]:
              - strong [ref=e1340]: f)
              - text: ) En caso de no ser el titular del vehículo y/o la persona sancionada cuyo nombre y firma aparezca en la boleta de sanción, se requiere original de carta poder simple dirigida a la Secretaría, firmada por quien otorga el poder, quien lo recibe y dos testigos, con copia de identificación oficial vigente de los cuatro firmantes.
            - paragraph [ref=e1341]:
              - strong [ref=e1342]: g)
              - text: Si es persona moral, el representante legal deberá acreditarlo con copia del poder notarial, en cuyo caso deberá realizar la gestión de forma personal. En el caso de vehículos oficiales, copia del resguardo del vehículo y del nombramiento expedido por la dependencia correspondiente.
              - text: La liberación de la matrícula y/o placa retenida del vehículo sancionado deberá ser en un término máximo de 30 días naturales contados a partir del día siguiente de la imposición de la sanción. Transcurrido dicho término, la Secretaría podrá disponer de la(s) placa(s) de circulación retenida(s) y darle(s) el destino que determine; para tal efecto, el propietario, legal poseedor o conductor sancionado, podrá acudir al domicilio señalado con el fin de que se le proporcione información sobre su(s) placa(s).
            - separator [ref=e1343]
            - paragraph [ref=e1344]
            - paragraph [ref=e1345]:
              - strong [ref=e1346]: FALTAS EN LA PRESTACIÓN DEL SERVICIO
            - paragraph [ref=e1347]:
              - text: Corresponde a la
              - strong [ref=e1348]: Dirección General de Inspección y Vigilancia Ambiental
              - text: de la Secretaría en el ámbito de su competencia, vigilar que los Verificentros, los proveedores de equipos, programas de cómputo y servicios operen correctamente los sistemas, procedimientos, instalaciones, equipos, plazos y condiciones establecidos en la Ley Ambiental de la Ciudad de México, Normas Oficiales Mexicanas, Normas Ambientales para la Ciudad de México, Autorizaciones, Revalidaciones de Autorización, Reglamento de la Ley Ambiental de la Ciudad de México en Materia de Verificación Vehicular,
              - strong [ref=e1349]: Programa Hoy No Circula,
              - text: el presente programa, y demás disposiciones jurídicas y administrativas aplicables; así como iniciar procedimientos administrativos con base en la documentación e información que se proporcione o con la que disponga la Secretaría.
            - paragraph [ref=e1350]:
              - text: Dado lo anterior, cualquier anomalía en la prestación del servicio se podrá reportar en la
              - strong [ref=e1351]: Dirección General de Inspección y Vigilancia Ambiental
              - text: de la Secretaría, ubicada en Acceso 1 del Bosque de San Juan de Aragón, Avenida José Loreto Fabela sin número, Colonia San Juan de Aragón, Alcaldía Gustavo A. Madero, Código Postal 07969, Ciudad de México, de lunes a viernes dentro de un horario de 09:00 a 15:00 horas en días hábiles y laborables, de lunes a sábado dentro de un horario de 08:00 a 20:00 horas en días hábiles y laborables en el teléfono 55-9689-5009 ext. 5000 o en Locatel al teléfono 55-5658-1111. Asimismo, podrá presentar su inconformidad en los buzones de quejas y sugerencias instalados en los
              - strong [ref=e1352]: Centro de Verificación
              - strong [ref=e1353]: de Emisiones
              - strong [ref=e1354]: Vehicular
              - strong [ref=e1355]: es
              - text: ", o a través del correo electrónico de denuncias de la Secretaría"
              - link "denuncias@sedema.cdmx.gob.mx" [ref=e1356] [cursor=pointer]:
                - /url: mailto:denuncias@sedema.cdmx.gob.mx
                - strong [ref=e1357]: denuncias@sedema.cdmx.gob.mx
            - paragraph [ref=e1358]:
              - text: Asimismo, podrá presentar su inconformidad en los buzones de quejas y sugerencias instalados en los
              - strong [ref=e1359]: Centros de Verificación de Emisiones Vehiculares
              - text: .
            - paragraph [ref=e1360]: "Los datos necesarios para atender y dar seguimiento a una denuncia son:"
            - paragraph [ref=e1361]: · Nombre completo y datos de ubicación del denunciante (Indicar dirección, teléfono y/o correo electrónico del denunciante para poder contactarlo de ser necesario).
            - paragraph [ref=e1362]:
              - text: · Lugar de los hechos (Señalar calle, número, colonia, alcaldía, código postal, clave del
              - strong [ref=e1363]: Centros de Verificación de Emisiones Vehiculares
              - text: o datos que permitan ubicar el predio).
            - paragraph [ref=e1364]: · Hechos denunciados (Describir los hechos que se denuncian y las afectaciones al medio ambiente en su caso).
            - paragraph [ref=e1365]: · Momento en que se suscitan los hechos (Indicar cuándo ocurrieron los hechos, fecha y horario aproximado).
            - paragraph [ref=e1366]: · Personas presuntas responsables (Señalar, de ser posible, el nombre y cargo de las personas que participaron en los hechos).
            - paragraph [ref=e1367]: · Información complementaria (Cualquier información que permita ubicar y dar seguimiento a los hechos referidos).
            - paragraph [ref=e1368]: "· Elementos probatorios (Referir y anexar todas las pruebas que se tengan para acreditar los hechos, como son: documentos, fotografías y videos, entre otros)."
            - separator [ref=e1369]
            - heading "¿A quién acudir en caso de abusos por parte de la policía?" [level=3] [ref=e1370]:
              - strong [ref=e1371]: ¿A quién acudir en caso de abusos por parte de la policía?
            - paragraph [ref=e1372]:
              - strong [ref=e1373]: "SISTEMA DE DENUNCIA CIUDADANA DE LA SECRETARÍA DE LA CONTRALORÍA GENERAL DE LA CIUDAD DE MÉXICO:"
            - paragraph [ref=e1374]:
              - link "Anticorrupción" [ref=e1375] [cursor=pointer]:
                - /url: http://www.contraloria.cdmx.gob.mx/#1
                - strong [ref=e1376]: Anticorrupción
            - paragraph [ref=e1377]:
              - text: "Denuncia de irregularidades al 55 5627 9700 y 55 5627 9739 o al siguiente link:"
              - link:
                - /url: http://www.contraloria.cdmx.gob.mx/pcontraloria/denuncia.php
              - strong [ref=e1378]:
                - link "www.contraloria.cdmx.gob.mx/pcontraloria/denuncia.php" [ref=e1379] [cursor=pointer]:
                  - /url: https://www.contraloria.cdmx.gob.mx/pcontraloria/denuncia.php
            - paragraph [ref=e1380]:
              - strong [ref=e1381]: "EN CASO DE ALGÚN ABUSO POR PERSONAL DE TRÁNSITO DE LA CIUDAD DE MÉXICO, COMUNÍCATE A:"
            - paragraph [ref=e1382]: Secretaría de Seguridad Ciudadana, Unidad de Asuntos Internos al 55 5242 5100 Ext. 1121 y 1122
            - paragraph [ref=e1383]:
              - strong [ref=e1384]: "EN CASO DE ALGÚN ABUSO POR PERSONAL DE TRÁNSITO DEL ESTADO DE MÉXICO, COMUNÍCATE A:"
            - paragraph [ref=e1385]: Secretaría de Seguridad Ciudadana 722 275 83 00, Infracción Transparente 800 900 3300, denuncia anónima 089, correo asuntos.internos@ssedomex.gob.mx , Centro de Atención Telefónica del Gobierno del Estado de México (CATGEM) 800 696 9696.
            - paragraph [ref=e1386]
