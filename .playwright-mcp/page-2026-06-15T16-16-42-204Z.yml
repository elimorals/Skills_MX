                  - /url: https://citasverificentros.cdmx.gob.mx/
                  - strong [ref=e123]: Centros de Verificación de Emisiones Vehiculares Autorizados para operar en la Ciudad de México
              - listitem [ref=e124]:
                - link "Centros de Verificación de Emisiones Vehiculares para vehículos pesados a diésel" [ref=e125] [cursor=pointer]:
                  - /url: https://www.sedema.cdmx.gob.mx/storage/app/media/obligaciones-transparencia/directorioCVV_autorizados.pdf
                  - strong [ref=e126]: Centros de Verificación de Emisiones Vehiculares para vehículos pesados a diésel
            - link [ref=e129] [cursor=pointer]:
              - /url: https://citasverificentros.cdmx.gob.mx/
              - img [ref=e130]
            - generic [ref=e131]:
              - text: Asimismo que tu auto no cuente con adeudos de tenencia, infracciones al Reglamento de Tránsito o sanciones impuestas por
              - strong [ref=e132]: SEDEMA
              - text: "o bien fotocívicas en el portal oficial de Internet de la Agencia digital de Innovación Pública:"
              - link "tramites.cdmx.gob.mx/fotocivicas/public/consulta-verificacion," [ref=e133] [cursor=pointer]:
                - /url: https://tramites.cdmx.gob.mx/fotocivicas/public/consulta-verificacion,
                - strong [ref=e134]: tramites.cdmx.gob.mx/fotocivicas/public/consulta-verificacion
                - text: ","
              - text: "o en portal oficial de Fotocívicas de la Secretaría de Movilidad:"
              - link "tramites.cdmx.gob.mx/fotocivicas/public/," [ref=e135] [cursor=pointer]:
                - /url: https://tramites.cdmx.gob.mx/fotocivicas/public/,
                - strong [ref=e136]: tramites.cdmx.gob.mx/fotocivicas/public/
                - text: ","
              - text: "o en el portal oficial de Internet Secretaría de Administración y Finanzas:"
              - link "data.finanzas.cdmx.gob.mx/sma/Consultaciudadana" [ref=e137] [cursor=pointer]:
                - /url: https://data.finanzas.cdmx.gob.mx/sma/Consultaciudadana
                - strong [ref=e138]: data.finanzas.cdmx.gob.mx/sma/Consultaciudadana
              - text: .
            - separator [ref=e139]
            - paragraph [ref=e140]:
              - strong [ref=e141]: CALENDARIO PARA REALIZAR LA VERIFICACIÓN DE EMISIONES VEHICULARES
            - paragraph [ref=e142]: Los vehículos deberán realizar y aprobar la verificación de emisiones vehiculares y revisión de componentes de control ambiental cada semestre, salvo el caso de los que obtengan un holograma doble cero “00”, en cuyo caso la unidad estará exenta de la obligación de verificar sus emisiones hasta por tres semestres de verificación vehicular posteriores al semestre en que se obtuvo.
            - paragraph [ref=e143]: "Los vehículos matriculados en la Ciudad de México deberán continuar verificando conforme al color del Engomado de Circulación o al último dígito numérico de las placas de circulación del vehículo, en los siguientes términos:"
            - paragraph [ref=e144]:
              - strong [ref=e145]: Programa de Verificación Vehicular Obligatorio para el primer semestre de 2026
            - paragraph [ref=e146]:
              - img [ref=e147]
            - paragraph [ref=e148]
            - paragraph [ref=e149]
            - heading "Si quieres revisar tus adeudos haz click aquí" [level=3] [ref=e150]:
              - strong [ref=e151]: Si quieres revisar tus adeudos haz
              - link "click aquí" [ref=e152] [cursor=pointer]:
                - /url: https://tramites.cdmx.gob.mx/fotocivicas/public/consulta-verificacion
                - strong [ref=e153]: click aquí
              - strong [ref=e154]
            - separator [ref=e155]
            - paragraph [ref=e156]: Los vehículos de cualquier uso que se registren por primera vez, o que, encontrándose matriculados en la Ciudad de México deciden cambiar de placa, deberán ser verificados dentro de los 180 días naturales contados a partir de la fecha de expedición de la tarjeta de circulación, con excepción de los que porten “Holograma “00”, los cuales deberán verificar conforme a la vigencia del mismo, situación que no exime de portar el certificado y holograma de verificación correspondientes a la matricula anterior.
            - paragraph [ref=e157]: Los vehículos con registro previo en la Ciudad de México, que porten el certificado y holograma de verificación correspondiente a la matricula previa, mantendrán los beneficios a la circulación de acuerdo al tipo de holograma que hayan obtenido, continuando con su vigencia en tanto realizan la próxima verificación dentro del plazo señalado con antelación.
            - paragraph [ref=e158]: Los certificados y hologramas obtenidos a través de la verificación voluntaria permanecerán vigentes hasta la fecha de su vencimiento.
            - paragraph [ref=e159]:
              - text: Si transcurridos los 180 días para el caso de los registrados por primera vez, o si, previo al cambio de matrícula en el caso de los ya registrados en la Ciudad de México, el vehículo automotor no acreditó la aprobación de la Verificación Vehicular, el propietario o legal poseedor de éste, deberá respetar las limitaciones a la circulación por no portar holograma vigente, de acuerdo a lo establecido en el
              - strong [ref=e160]: Programa Hoy No Circula
              - text: ", así mismo, para efectos de regularizar la verificación, se hará acreedor a una multa por Verificación Extemporánea la cual deberá pagar con la placa nueva y/o actual, misma que le permitirá trasladar el vehículo al taller mecánico para las reparaciones o mantenimiento respectivo, o en su caso, para trasladarse al"
              - strong [ref=e161]: Centro de Verificación
              - strong [ref=e162]: de Emisiones
              - strong [ref=e163]: Vehicular
              - strong [ref=e164]: es
              - text: el día programado en su cita, lo anterior, mientras el pago respectivo se encuentre vigente.
            - paragraph [ref=e165]: Los vehículos que porten matrícula que esté conformada por dos o más series de números o que contengan series numéricas y letras, símbolos, guiones o emblemas, deberán realizar la verificación vehicular de conformidad con el último dígito numérico de la placa.
            - paragraph [ref=e166]: Los vehículos que carezcan de dígito numérico en su terminación de la matrícula, deberán realizar la verificación vehicular conforme el período de la terminación 9 o 0.
            - paragraph [ref=e167]:
              - text: Los vehículos cuyo último dígito numérico de la placa de circulación no corresponda con el color del engomado de circulación del vehículo, deberán realizar la verificación vehicular y respetar las limitaciones a la circulación establecidas en el
              - strong [ref=e168]: Programa Hoy No Circula
              - text: y en el
              - strong [ref=e169]: Programa para Prevenir y Responder a Contingencias Ambientales Atmosféricas en la Ciudad de México
              - text: ", conforme al último dígito numérico de la matrícula."
            - paragraph [ref=e170]: En el caso de matrículas de taxi que realicen sustitución por un vehículo usado previamente matriculado en la Ciudad de México, el vehículo deberá ser verificado dentro de los 180 días naturales contados a partir de la fecha de expedición de la tarjeta de circulación, presentando el certificado y holograma de verificación correspondientes a la matricula anterior al alta como taxi, o el pago de la multa por verificación extemporánea en caso de no contar con estos últimos.
            - paragraph [ref=e171]:
              - text: Los vehículos de cualquier uso con número de matrícula ya asignada, que únicamente cuenten con el trámite de alta, renovación, reposición o sustitución entre otros, ante la Secretaría de Movilidad de la Ciudad de México, deberán realizar la verificación vehicular de acuerdo con el último dígito numérico de la matrícula asignada. Para el caso de vehículos de transporte público de pasajeros y de carga, cuya matrícula este rotulada en la unidad, deberán exhibir el documento del trámite de la citada Secretaría de Movilidad de la Ciudad de México, por lo que el
              - strong [ref=e172]: Centro de Verificación
              - strong [ref=e173]: de Emisiones
              - strong [ref=e174]: Vehicular
              - strong [ref=e175]: es
              - text: deberá integrar dicho documento en el expediente de la verificación, no será necesario presentar la tarjeta de circulación, ni las placas del vehículo.
            - paragraph [ref=e176]:
              - text: A los vehículos pertenecientes a las Dependencias, Unidades Administrativas, Unidades de Apoyo Técnico Operativo, Fiscalía General de Justicia, Órganos Desconcentrados, Alcaldías y Entidades de la Administración Pública de la Ciudad de México, podrán ser verificados del
              - strong [ref=e177]: 02 de enero de 2026 al 30 de junio de 2026
              - text: ", dicha determinación aplicará para vehículos de dependencias locales y federales siempre y cuando se encuentren regulares en su verificación anterior y que la tarjeta de circulación este a nombre de la dependencia."
            - paragraph [ref=e178]:
              - text: Los propietarios o legales poseedores podrán verificar sus vehículos antes de su periodo de verificación, con el fin de acceder a un holograma con mayores beneficios de circulación, debiendo pagar la verificación respectiva, para la prestación de este servicio, el
              - strong [ref=e179]: Centro de Verificación
              - strong [ref=e180]: de Emisiones
              - strong [ref=e181]: Vehicular
              - strong [ref=e182]: es
              - text: será responsable de verificar la vigencia y que se cumpla las posibilidades de acceder a un holograma de más beneficios. La constancia de verificación aprobatoria obtenida corresponderá al semestre en curso y no será necesario verificar en el periodo correspondiente conforme al calendario establecido.
            - paragraph [ref=e183]: Los propietarios o legales poseedores de los vehículos que cuenten con un certificado “00” y hayan realizado cambio de placa, podrán verificar sus vehículos antes del periodo de verificación de la nueva placa, con el fin de obtener el holograma que les permita circular, el cual les otorgará la vigencia del periodo correspondiente a la terminación de la nueva placa.
            - separator [ref=e184]
            - paragraph [ref=e185]:
              - strong [ref=e186]: "Casos para ampliar el periodo para verificar:"
            - paragraph [ref=e187]: "Se podrá ampliar el período para verificar por un término de 15 días naturales, siempre y cuando los vehículos se encuentren en alguno de los siguientes supuestos:"
            - paragraph [ref=e188]:
              - strong [ref=e189]: "1."
              - text: Haber obtenido un rechazo en los últimos 7 días naturales de su periodo en el mismo
              - strong [ref=e190]: Centro de Verificación
              - strong [ref=e191]: de Emisiones Vehiculares
              - text: .
            - paragraph [ref=e192]:
              - text: Para este caso, el
              - strong [ref=e193]: Centro de Verificación
              - strong [ref=e194]: de Emisiones Vehiculares
              - text: ", además de los requisitos establecidos en el numeral 9 del presente programa, deberá corroborar que el rechazo haya sido emitido en los últimos 7 días naturales de su periodo de verificación, que el vehículo no presente adeudos por infracciones, sanciones o tenencia, una vez corroborado lo anterior, se podrá prestar el servicio sin el pago de la multa por verificación extemporánea, debiendo anexar al expediente las consultas realizadas y el rechazo resultado de la nueva verificación."
            - paragraph [ref=e195]: Si transcurridos los 15 días de ampliación al periodo el vehículo no acreditó la verificación, para la prestación del servicio se deberá presentar el pago de la multa por verificación extemporánea correspondiente, no estando obligado a hacerlo en el mismo Verificentro donde se generó el rechazo.
            - paragraph [ref=e196]:
              - strong [ref=e197]: "2."
              - text: Que el vehículo no pueda realizar la verificación vigente debido a que el portal de consulta de adeudos (De la
              - strong [ref=e198]: ADIP
              - text: ", de la Secretaría de Administración y Finanzas ("
              - strong [ref=e199]: SAF
              - text: ) o
              - strong [ref=e200]: ADIP
              - text: o cita para verificar) no refleja pago o pagos previos realizados durante los últimos siete días naturales del periodo por concepto de infracciones al Reglamento de Tránsito de la Ciudad de México con sanción económica y sanciones al Reglamento de la Ley Ambiental de la Ciudad de México, en Materia de Verificación Vehicular.
            - paragraph [ref=e201]:
              - text: Para este supuesto, dentro de los 15 días de ampliación al periodo, el
              - strong [ref=e202]: Centro de Verificación
              - strong [ref=e203]: de Emisiones Vehiculares
              - text: deberá corroborar que la consulta de adeudos presentada haya sido realizada durante los últimos siete días naturales del periodo, asimismo, que el vehículo no presente adeudos por infracciones, sanciones o tenencia, una vez corroborado lo anterior, se podrá prestar el servicio sin el pago de la multa por verificación extemporánea, debiendo anexar al expediente las consultas presentadas y realizadas.
            - paragraph [ref=e204]:
              - text: Si trascurridos los 15 días de ampliación, el portal de consulta de adeudos (
              - strong [ref=e205]: ADIP
              - text: o
              - strong [ref=e206]: SAF
              - text: ) no refleja aun el pago realizado durante los últimos siete días del periodo, el
              - strong [ref=e207]: Centro de Verificación de Emisiones Vehiculares
              - text: deberá imprimir y proporcionar al ciudadano la consulta de adeudos en la que se observe que continúa el mismo, orientando al ciudadano que acuda a la
              - strong [ref=e208]: SAF
              - text: a resolver los elementos que eviten que la información se refleje de manera correcta en el portal.
            - paragraph [ref=e209]:
              - text: Si trascurridos los 15 días de ampliación otorgada, el vehículo no cuenta con verificación vigente, el
              - strong [ref=e210]: Centro de Verificación
              - strong [ref=e211]: de Emisiones Vehiculares
              - text: deberá corroborar que el vehículo no presente adeudos por infracciones, sanciones o tenencia, una vez corroborado lo anterior, se podrá prestar el servicio solicitando el pago de la multa por verificación extemporánea correspondiente, debiendo anexar al expediente las consultas presentadas, realizadas y el pago de la multa respectiva.
            - paragraph [ref=e212]:
              - strong [ref=e213]: "3."
              - text: Que el vehículo no pueda realizar la verificación vigente debido a que el portal de consulta de adeudos (
              - strong [ref=e214]: ADIP
              - text: o
              - strong [ref=e215]: SAF
              - text: cita para verificar) refleja sanciones cívicas de cualquier tipo, durante los últimos siete días naturales del periodo.
            - paragraph [ref=e216]:
              - text: Para este supuesto, dentro de los 15 días de ampliación al periodo, el
              - strong [ref=e217]: Centro de Verificación
              - strong [ref=e218]: de Emisiones Vehiculares
              - text: deberá corroborar que la consulta de adeudos presentada haya sido realizada durante los últimos días 7 días naturales del periodo, asimismo, que el vehículo no presente adeudos por infracciones, sanciones o tenencia. Una vez corroborado lo anterior, se podrá prestar el servicio sin el pago de la multa por verificación extemporánea, debiendo anexar al expediente las consultas presentadas y realizadas.
            - paragraph [ref=e219]: El propietario o legal poseedor del vehículo que requiera realizar un curso en línea en ese momento, podrá solicitar en el Verificentro una terminal para realizar el curso y una vez eliminado el bloqueo, y se refleje en la página de la ADIP o SAF, solicitar la prestación del servicio de verificación de su vehículo.
            - paragraph [ref=e220]:
              - text: Si trascurridos los 15 días de ampliación, el portal de consulta de adeudos (
              - strong [ref=e221]: ADIP
              - text: o
              - strong [ref=e222]: SAF
              - text: o cita para acudir a verificar) no refleja aún las sanciones por foto cívicas solventadas, el
              - strong [ref=e223]: Centro de Verificación
              - strong [ref=e224]: de Emisiones
              - strong [ref=e225]: Vehicular
              - strong [ref=e226]: es
              - text: deberá imprimir y proporcionar al ciudadano la consulta de adeudos en la que se observe que continúa el adeudo, orientando al ciudadano que acuda a la
              - strong [ref=e227]: SEMOVI
              - text: a resolver los elementos que eviten que la información se refleje de manera correcta en el portal.
            - paragraph [ref=e228]:
              - text: Si trascurridos los 15 días de ampliación otorgada, el vehículo no cuenta con verificación vigente, el
              - strong [ref=e229]: Centro de Verificación
              - strong [ref=e230]: de Emisiones Vehiculares
              - text: deberá corroborar que el vehículo no presente adeudos por infracciones, sanciones o tenencia, una vez corroborado lo anterior, se podrá prestar el servicio solicitando el pago de la multa por verificación extemporánea correspondiente, debiendo anexar al expediente las consultas presentadas, realizadas y el pago de la multa respectivo.
