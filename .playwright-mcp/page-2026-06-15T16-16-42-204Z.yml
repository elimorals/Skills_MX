              - text: de la Secretaría, en donde se acredita el uso de sistemas integrales certificados autorizados por la misma, además deben entregar copia del dictamen técnico vigente otorgado por alguna Unidad de Verificación acreditada en alcance a la Norma Oficial Mexicana NOM-005-SESH-2010, Equipos de Carburación de Gas L.P. en motores de combustión interna. Instalación y mantenimiento, autorizada por la Secretaría de Energía, y la NOM-011-SECRE-2000, Gas Natural Comprimido para uso automotor. Requisitos mínimos de seguridad en instalaciones vehiculares, autorizada por la Comisión Reguladora de Energía.
              - text: En caso de vehículos que desde agencia fueron vendidos con la posibilidad de utilizar gas licuado de petróleo o gas natural y que deseen obtener el “Holograma “0”, además de los documentos requeridos para el proceso de Verificación Vehicular, deberán presentar copia de la factura o carta factura en donde se especifique que de fábrica la unidad cuenta con sistemas de uso de gas natural o gas licuado de petróleo, además deben entregar copia del dictamen técnico vigente otorgado por alguna Unidad de Verificación acreditada en alcance a la Norma Oficial Mexicana NOM-005-SESH-2010, Equipos de carburación de Gas L.P. en motores de combustión interna. Instalación y mantenimiento, autorizada por la Secretaría de Energía para los vehículos que usen Gas Licuado de Petróleo, o la Norma Oficial Mexicana NOM-011-SECRE-2000, Gas Natural Comprimido para uso automotor. Requisitos mínimos de seguridad en instalaciones vehiculares, autorizada por la Comisión Reguladora de Energía.
              - text: En el caso de vehículos matriculados en la Ciudad de México, con verificación previa en esta entidad que hayan realizado la baja vehicular con posterioridad a la vigencia del certificado anterior deberá presentar el pago de multa por verificación extemporánea con la placa nueva y/o actual, en caso de no contar con el pago de la multa original, se podrá exhibir copia certificada del pago emitida por la Secretaría de Administración y Finanzas de la Ciudad de México, lo cual deberá ser verificado por el Centro de Verificación de Emisiones Vehiculares asentando el nombre y firma de la persona que realizó la compulsa con base en la información en el portal de pagos (
