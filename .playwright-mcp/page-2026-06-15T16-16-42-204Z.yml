            - paragraph [ref=e1074]:
              - text: "Aquellos vehículos que no se encuentren registrados en el portal de la Agencia Digital de Innovación Pública y de la Secretaría de Administración y Finanzas ambas de la Ciudad de México, deberán ser canalizados a las áreas de Administración Tributaria o Centros de Servicio de la Tesorería más cercanos a su domicilio, de lunes a viernes de las 9:00 a 13:30 horas, a fin de registrar los datos de sus vehículos, presentando los siguientes documentos en original y copia para cotejo, debiendo asentar en el expediente el nombre y firma de quien los recibe y valida:"
