            - paragraph [ref=e1149]:
              - text: En caso de vehículos que hayan sido convertidos al uso de gas licuado de petróleo o gas natural y que deseen obtener el “Holograma “0”, además de los documentos requeridos para el proceso de Verificación Vehicular, deberán presentar el holograma adherido en un lugar visible y el oficio de autorización vigente emitido por la
