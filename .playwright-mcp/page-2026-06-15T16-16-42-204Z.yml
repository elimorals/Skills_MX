              - text: Aquellos vehículos que presenten alguna leyenda en cualquiera de los conceptos a validar distinta a la referida anteriormente, que impida verificar su estatus, deberán acudir a la Secretaría de Seguridad Ciudadana, a la Secretaría de Movilidad, a la
              - strong [ref=e1080]: Dirección General de Inspección y Vigilancia Ambiental
