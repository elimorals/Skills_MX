            - paragraph [ref=e517]:
              - text: Vehículos y camionetas ligeras nuevos, incluidos híbridos categoría III, que cumplen con el estándar nacional vigente (C de la
              - strong [ref=e518]: NOM-042-SEMARNAT-2003
              - text: ). Se les aplicará la prueba de emisiones vehiculares dinámica o estática de acuerdo con lo establecido en la
              - strong [ref=e519]: NOM-047-SEMARNAT-2014
              - text: ", debiendo cumplir con los límites máximos permisibles establecidos en la"
              - strong [ref=e520]: Tabla 2
              - text: ", así como una prueba"
              - strong [ref=e521]: SDB
              - text: con fines estadísticos.
            - paragraph [ref=e522]:
              - text: Los valores establecidos en la tabla anterior deberán ser documentados ante la
              - strong [ref=e523]: Dirección General de Calidad del Aire
              - text: "de la Secretaría para que los automotores puedan ser considerados para recibir la constancia “00”, debiendo considerarse lo siguiente:"
            - paragraph [ref=e524]:
              - strong [ref=e525]: a)
              - text: Las emisiones evaporativas reportadas deberán ser bajo protocolo de 24, 48 o 72 horas.
            - paragraph [ref=e526]:
              - strong [ref=e527]: b)
              - text: El rendimiento de combustible deberá ser calculado y reportado usando el protocolo referido en la
              - strong [ref=e528]: NOM-163-SEMARNAT-ENER-SCFI-2013
              - text: .
            - paragraph [ref=e529]
            - paragraph [ref=e530]:
              - strong [ref=e531]: "- Requisitos para vehículos a diésel:"
            - paragraph [ref=e532]:
              - text: Podrán obtener este incentivo los propietarios o legales poseedores de vehículos de cualquier uso, con
              - strong [ref=e533]: PBV
              - text: mayor a 3,857 kg., que cumplan con el estándar 1AA, 1B, 2B, 3B o 4B, que se indica en la regulación nacional de la
              - strong [ref=e534]: NOM-044-SEMARNAT-2017
              - text: .
            - paragraph [ref=e535]:
              - text: Los valores de los estándares referidos en el párrafo anterior deberán ser documentados ante la
              - strong [ref=e536]: Dirección General de Calidad del Aire
              - text: de la Secretaría del Medio Ambiente de la Ciudad de México para que los automotores puedan ser considerados para recibir la constancia “00”; en el supuesto de automotores que se les instaló una trampa de partículas y que originalmente no contaban con este sistema de control de emisiones, el doble cero se entregará administrativamente.
            - paragraph [ref=e537]
            - paragraph [ref=e538]:
              - strong [ref=e539]: "- Requisitos para vehículos a Gas Natural:"
            - paragraph [ref=e540]:
              - text: Podrán obtener este incentivo los propietarios o legales poseedores de vehículos nuevos de cualquier uso, con
              - strong [ref=e541]: PBV
              - text: mayor a 3,857 kg., que utilicen gas natural como combustible y que cumplan con el estándar B de la tabla 1, 2, 3 o 4 de la
              - strong [ref=e542]: NOM076-SEMARNAT-2012
              - text: .
            - paragraph [ref=e543]:
              - text: La información sobre el nivel de emisión de contaminantes y el rendimiento de cada submarca deberá ser proporcionado por cada empresa fabricante o importadora de los automotores. En caso de que la misma no sea proporcionada a la Secretaría, los mismos no podrán ser valorados y no obtendrán el incentivo del
              - strong [ref=e544]: Holograma “00”
              - text: .
            - paragraph [ref=e545]:
              - text: En el supuesto de que algún vehículo no haya obtenido el
              - strong [ref=e546]: Holograma “00
              - text: ” debido a la falta de información de parte de las empresas que comercializan dicho automotor, podrá acudir nuevamente al
              - strong [ref=e547]: Centros de Verificación de Emisiones Vehiculares
              - text: de su preferencia posterior a que dicho vehículo se encuentre en la lista de los vehículos candidatos, debiendo cubrir la tarifa respectiva para verificar.
            - paragraph [ref=e548]: La vigencia se calculará a partir de la fecha de emisión de la factura o carta factura, y/o contrato de arrendamiento de vehículos nuevos. Para los casos de vehículos extranjeros el título de propiedad donde se informe la fecha de adquisición del automotor.
            - paragraph [ref=e549]: Al término de la vigencia de este holograma, se podrá otorgar por única ocasión un nuevo holograma por dos años, siempre y cuando se cumpla con lo establecido en el presente Programa y se encuentren dentro del listado publicado en la página de internet de la Secretaría, la vigencia de este “Holograma “00” se calculará a partir de la fecha de terminación de la vigencia del certificado de Verificación Vehicular obtenido en el periodo inmediato anterior, misma que deberá ser ingresada al sistema durante el proceso de captura correspondiente.
            - paragraph [ref=e550]:
              - text: Los vehículos que porten
              - strong [ref=e551]: Holograma “00
              - text: "”, cuya vigencia llegue a su término durante el presente Programa, mantendrán el beneficio de exención a las limitaciones a la circulación establecidas en el Programa Hoy No Circula, en tanto realizan su próxima verificación (haya ocurrido o no un cambio de matrícula) de conformidad con lo siguiente:"
            - paragraph [ref=e552]:
              - text: Si la vigencia del
              - strong [ref=e553]: Holograma “00”
              - text: culmina en el periodo de verificación correspondiente a la terminación de la placa del vehículo, deberá verificar en dicho periodo, pudiendo hacerlo desde el primer día al último de su periodo, aún si la vigencia del holograma no ha concluido.
            - paragraph [ref=e554]: Si el período de verificación al que corresponden las placas ha concluido o no ha iniciado, deberá verificar desde el día siguiente del vencimiento de su holograma y hasta el último día de su período inmediato de verificación vehicular, de acuerdo con la terminación de su placa y/o matrícula.
            - separator [ref=e555]
            - paragraph [ref=e556]:
              - strong [ref=e557]: CONSTANCIA PARA EL PROGRAMA DE AUTORREGULACIÓN AMBIENTAL DE VEHÍCULOS A DIÉSEL O PARA IMPULSAR LA ELECTROMOVILIDAD EN VEHÍCULOS LIGEROS DE LA CIUDAD DE MÉXICO.
            - paragraph [ref=e558]: Los vehículos que utilicen diésel como combustible o vehículos ligeros que de manera voluntaria participen en el Programa de Autorregulación para vehículos a diésel o para impulsar la electromovilidad en vehículos ligeros, deberán sujetarse al procedimiento, requisitos y periodos establecidos en los Programas publicados en la Gaceta Oficial de la Ciudad de México el 16 de junio y 2 de diciembre del 2022 respectivamente.
            - separator [ref=e559]
            - paragraph [ref=e560]:
              - strong [ref=e561]: CONSTANCIA PARA EL USO DE COMBUSTIBLES ALTERNOS EN VEHÍCULOS DE USO PARTICULAR E INTENSIVO DE LA CIUDAD DE MÉXICO
            - paragraph [ref=e562]:
              - text: Los vehículos que instalen un Sistema Integral de Inyección Electrónica a Gas Natural Comprimido (
              - strong [ref=e563]: GNC
              - text: ) o Gas Licuado de Petróleo (
              - strong [ref=e564]: GLP
              - text: ") con las personas certificadas y/o autorizadas por la Secretaría y que estén matriculados en la Ciudad de México o que porten matrícula federal o que verifiquen voluntariamente en la Ciudad de México, interesados en exentar las restricciones a la circulación establecidas en el Programa Hoy No Circula, deberán de apegarse a lo establecido en lo siguiente:"
            - paragraph [ref=e565]:
              - text: Las personas interesadas deberán realizar el trámite denominado “Registro y Control de Vehículos de uso particular e intensivo que carburan a Gas Licuado de Petróleo (
              - strong [ref=e566]: GLP
              - text: ) o Gas Natural Comprimido (
              - strong [ref=e567]: GNC)
              - text: ”, ante la
              - strong [ref=e568]: Dirección General de Calidad del Aire
              - text: "de la Secretaría, cuyo formato de trámite se puede obtener en la siguiente dirección electrónica:"
              - link "cdmx.gob.mx/public/InformacionTramite.xhtml?idTramite=62." [ref=e569] [cursor=pointer]:
                - /url: https://cdmx.gob.mx/public/InformacionTramite.xhtml?idTramite=62
                - strong [ref=e570]: cdmx.gob.mx/public/InformacionTramite.xhtml?idTramite=62
                - text: .
            - paragraph [ref=e571]:
              - text: La instalación de los equipos de gas será por medio de las personas certificados y/o autorizados por la Secretaría, y sólo podrán emplear los Sistemas Integrales de Inyección Electrónica a Gas Natural Comprimido (
              - strong [ref=e572]: GNC
              - text: ) o Gas Licuado de Petróleo (
              - strong [ref=e573]: GLP
              - text: ).
            - paragraph [ref=e574]:
              - text: Los vehículos registrados en el presente Programa podrán obtener el holograma de verificación vehicular tipo
              - strong [ref=e575]: “0”.
            - paragraph [ref=e576]: Los hologramas emitidos por el Estado de México dentro del Programa de Combustibles Alternos son reconocidos en la Ciudad de México.
            - separator [ref=e577]
            - paragraph [ref=e578]:
              - strong [ref=e579]: "CONSTANCIA DE VERIFICACIÓN TIPO CERO “0” (HOLOGRAMA “0”). SE PODRÁ OTORGAR ESTE TIPO DE HOLOGRAMA A LOS:"
            - paragraph [ref=e580]:
              - text: Vehículos a gasolina, híbridos categoría III, gas natural, gas licuado de petróleo u otros combustibles alternos que hayan cumplido con cualquiera de los estándares de emisiones de la norma
              - strong [ref=e581]: NOM-042-SEMARNAT-2003
              - text: conforme a la lista publicada en la página de internet de la
              - strong [ref=e582]: Secretaría del Medio Ambiente
              - text: ", año modelo 2006 y posteriores, que aprueben la prueba"
              - strong [ref=e583]: SDB
              - text: (Sistema de Diagnóstico a Bordo) de acuerdo con lo establecido en la
              - strong [ref=e584]: NOM-167-SEMARNAT-2017
              - text: . Adicionalmente para vehículos año-modelo 2006 a 2009 con el estándar A de la norma
              - strong [ref=e585]: NOM-042-SEMARNAT-2003
              - text: ", se deberá realizar una prueba de emisiones."
            - paragraph [ref=e586]:
              - text: En el caso que el vehículo automotor, de acuerdo con la información del fabricante, deba de ser evaluado por
              - strong [ref=e587]: SDB
              - text: y el sistema de verificación vehicular no logre una conexión con la computadora de abordo conforme a lo establecido en la
              - strong [ref=e588]: NOM-167-SEMARNAT-2017
              - text: se deberá de dar inicio nuevamente a la prueba siguiendo las instrucciones que el sistema de verificación vehicular reporte en la pantalla de la Estación de Inspección Visual y Prueba
              - strong [ref=e589]: SDB
              - text: ", si persiste la desconexión, el vehículo será evaluado por emisiones, debiendo cumplir con los límites máximos permisibles establecidos en la"
              - strong [ref=e590]: Tabla 2.
            - paragraph [ref=e591]:
              - text: En aquellos en donde se haya logrado comunicación con el sistema
              - strong [ref=e592]: SDB
              - text: pero no cumpla con los criterios de aprobación establecidos en el numeral 4.1.2 de la Norma Oficial Mexicana
              - strong [ref=e593]: NOM-167-SEMARNAT-2017
              - text: deberá cumplir con los límites máximos permisibles establecidos en la
              - strong [ref=e594]: Tabla 2
              - text: .
            - paragraph [ref=e595]:
              - text: En caso de que algunos de los monitores de los sistemas de control de emisiones requeridos en el numeral 4.1.2 de la Norma Oficial Mexicana
