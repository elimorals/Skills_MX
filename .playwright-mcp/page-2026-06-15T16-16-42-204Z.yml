            - paragraph [ref=e1024]:
              - strong [ref=e1025]: CONSTANCIA DE VERIFICACIÓN DE NO APROBACIÓN (RECHAZO). ESTE DOCUMENTO LO OBTENDRÁN AQUELLOS
              - text: ":"
            - paragraph [ref=e1026]:
              - text: Vehículos que no acrediten el proceso de revisión visual de conformidad con el numeral 5.5.4 del Manual para los vehículos a que usen gasolina como carburante, para los vehículos con gas natural comprimido o gas licuado del petróleo no se revisa el componente “Tapón de gasolina” para vehículos a diésel el proceso de revisión visual debe realizarse de conformidad con el numeral 5.1 de la
              - strong [ref=e1027]: NOM-045-SEMARNAT-2017.
            - paragraph [ref=e1028]:
              - text: Los vehículos que hayan sido verificados durante el semestre vigente con un resultado aprobatorio y haya realizado una nueva verificación obteniendo como resultado un “Rechazo”, dispondrán de 30 días naturales contados a partir de la emisión del rechazo para obtener un resultado aprobatorio y deberán respetar el
              - strong [ref=e1029]: Programa Hoy No Circula
