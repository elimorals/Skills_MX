              - text: Una vez hecho lo anterior, siempre y cuando se acredite en el portal de la Agencia Digital de Innovación Pública, de la Secretaría de Administración y Finanzas y de la Secretaría de Movilidad todas de la Ciudad de México, que utilizan los
              - strong [ref=e1081]: Centros de Verificación
