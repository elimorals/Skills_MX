                  - strong [ref=e116]: Aviso por el que se da a conocer el programa de Verificación Vehicular Obligatoria para el primer semestre de 2026
            - separator [ref=e117]
            - paragraph [ref=e118]:
              - strong [ref=e119]: ¿Dónde puedes realizar la verificación y agendar una cita?
            - list [ref=e120]:
              - listitem [ref=e121]:
