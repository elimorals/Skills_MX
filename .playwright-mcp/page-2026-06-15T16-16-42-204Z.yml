              - strong [ref=e1086]: e)
              - text: Los servicios que proporcionan los preverificadores y gestores no se encuentran autorizados, registrados, ni reconocidos por la Secretaría, razón por la cual se recomienda no contratar dichos servicios.
              - text: El estado físico y mecánico de los vehículos automotores que se presenten a realizar la prueba de verificación vehicular es responsabilidad de los propietarios y/o legales poseedores de estos.
              - text: "Portar ambas placas, salvo por las siguientes excepciones:"
