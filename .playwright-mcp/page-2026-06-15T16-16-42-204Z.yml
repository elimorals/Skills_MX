                - strong [ref=e1399]: Objetivos del programa de Verificación Vehicular
              - list [ref=e1400]:
                - listitem [ref=e1401]: Establecer el calendario y los lineamientos conforme a los cuales, los vehículos automotores de combustión interna matriculados en la Ciudad de México, y/o que soliciten de manera voluntaria el servicio de verificación, deberán ser evaluados de conformidad con las normas y procedimientos aplicables.
                - listitem [ref=e1402]: Evaluar los límites de emisiones contaminantes provenientes del escape y la condición operativa de los componentes de control ambiental de los vehículos automotores en circulación que usan gasolina, gas, diésel u otro combustible alterno, que se encuentren matriculados o que circulen en vialidades de la Ciudad de México.
                - listitem [ref=e1403]: Identificar a los vehículos automotores con alta tasa de emisión de contaminantes e inducir una reducción en los mismos a partir de la aplicación de mantenimiento correctivo en los vehículos.
                - listitem [ref=e1404]: Establecer los mecanismos, procedimientos y trámites que coadyuven en la prevención, control y disminución de emisiones contaminantes a la atmósfera provenientes de los vehículos automotores.
            - heading "Beneficiarios" [level=3] [ref=e1406]
            - paragraph [ref=e1408]: Toda la ciudadanía.
