            - paragraph [ref=e294]
            - paragraph [ref=e295]: Los vehículos que se encuentren en alguno de los supuestos antes descritos, mantendrán los beneficios a la circulación de acuerdo al tipo de holograma que hayan obtenido continuando con su vigencia durante los 15 días de ampliación.
            - separator [ref=e296]
            - heading [level=3] [ref=e297]
            - heading "PRUEBA DE INSPECCIÓN FÍSICO MECÁNICA" [level=3] [ref=e298]:
              - strong [ref=e299]: PRUEBA DE INSPECCIÓN FÍSICO MECÁNICA
            - paragraph [ref=e300]:
              - strong [ref=e301]: INSPECCIÓN FÍSICO MECÁNICA VOLUNTARIA
            - paragraph [ref=e302]: Los vehículos de uso particular que realicen el proceso de verificación en la Ciudad de México podrán ser sujetos de realizar una prueba de inspección físico - mecánica (sin costo), siempre y cuando se haya asignado a una línea de verificación que cuente con la infraestructura necesaria para la aplicación de tales pruebas y el usuario del vehículo de su autorización para realizar dicha prueba; los resultados obtenidos serán de carácter informativo para el ciudadano y no serán motivo de aprobación o rechazo. Esta prueba no corresponde a la descrita para revista y validación vehicular que se indica en el numeral 6.2 del presente programa.
            - paragraph [ref=e303]: La prueba de inspección físico - mecánica se realizará previo a la inspección visual y SDB, la cual incluye las pruebas de alineación al paso, banco de suspensiones, frenómetro y detector de holguras, mismas que no son invasivas para el vehículo automotor.
            - paragraph [ref=e304]:
              - text: El resultado de la prueba de inspección físico - mecánica será entregado al propietario y/o legal poseedor del vehículo y, en caso de así solicitarlo, el
              - strong [ref=e305]: Centro de Verificación
              - strong [ref=e306]: de Emisiones Vehiculares
              - text: realizará una explicación del resultado obtenido.
            - paragraph [ref=e307]:
              - strong [ref=e308]: INSPECCIÓN FÍSICO MECÁNICA PARA LA “REVISTA VEHICULAR” (TAXI) Y “VALIDACIÓN VEHICULAR” (PLATAFORMA Y APP)
            - paragraph [ref=e309]:
              - text: Las unidades que prestan el servicio de transporte de pasajeros público individual (taxi) en la Ciudad de México y los de servicio de transporte de pasajeros privado especializado con chofer, deberán sujetarse al procedimiento denominado “revista vehicular” y “validación vehicular” vigentes, respectivamente, conforme al procedimiento, requisitos y periodo que para tal efecto publique la Secretaría de Movilidad de la Ciudad de México (
              - strong [ref=e310]: SEMOVI
              - text: ).
            - paragraph [ref=e311]:
              - text: Para obtener información sobre los
              - strong [ref=e312]: Centros de Verificación de Emisiones Vehiculares
              - text: que realizan la inspección fisco mecánica, se deberá revisar la siguiente dirección electrónica
              - link:
                - /url: http://verificentros.sedema.cdmx.gob.mx:8080/dvc/
              - link "citasverificentros.cdmx.gob.mx" [ref=e313] [cursor=pointer]:
                - /url: https://citasverificentros.cdmx.gob.mx
                - strong [ref=e314]: citasverificentros.cdmx.gob.mx
            - separator [ref=e315]
            - paragraph [ref=e316]:
              - strong [ref=e317]: TARIFAS POR LA PRESTACIÓN DEL SERVICIO DE VERIFICACIÓN DE EMISIONES VEHICULARES
            - paragraph [ref=e318]:
              - text: El costo por los servicios de verificación vehicular que presten los Verificentros, para todo tipo de Constancia de Verificación (“Holograma “0”, “1”, “2”, Rechazo y Evaluación Técnica), así como del incentivo “00” que se entregue al usuario, es de
              - strong [ref=e319]: "5.625"
              - text: veces la Unidad de Medida y Actualización vigente más el Impuesto al Valor Agregado (IVA).
              - text: Las tarifas referidas anteriormente se actualizarán de manera anual, de conformidad con el ajuste de la Unidad de Medida y Actualización que publique el Instituto Nacional de Estadística y Geografía (
              - strong [ref=e320]: INEGI
              - text: ) en el Diario Oficial de la Federación y el aviso o Circular que emita la Secretaría.
              - text: La verificación en su segundo, cuarto, sexto, octavo, décimo o sucesivos intentos pares será gratuita, siempre y cuando la verificación que le anteceda sea un rechazo vehicular y se realice en el mismo
              - strong [ref=e321]: Centro de Verificación de Emisiones Vehiculares
              - text: en que se obtuvo el rechazo, este criterio aplicará en todos los periodos regulares de verificación vehicular otorgados por el presente programa, incluso los periodos otorgados por las Multas de Verificación Extemporánea (30 días naturales contados a partir del día natural siguiente del pago), en los casos en los que apliquen 180 días naturales a partir del registro por primera vez o cambio de placa en la Ciudad de México, los casos señalados en el numeral 5.1.9. , 8.6.1.1 del presente programa y en las verificaciones voluntarias.
            - paragraph [ref=e322]: El pago de la tarifa por la expedición de las reposiciones de Constancias de Verificación (holograma y/o certificado) será la que establezca el Código Fiscal de la Ciudad de México vigente.
            - paragraph [ref=e323]:
              - text: Las tarifas por concepto de verificación vehicular deberán indicarse de manera destacada y a la vista del público en todos los Verificentros, debiendo presentarse en moneda nacional.
              - text: Las copias o impresiones de los documentos necesarios para realizar la verificación vehicular de cada unidad, que el propietario o poseedor del automotor a verificar llegase a solicitar a los Verificentros, deberá ser cobrada en un máximo de un peso por cada copia fotostática o impresión realizada, debiendo imprimirse el concepto por copias fotostáticas o impresiones en el comprobante de pago, no estando obligado el Verificentro a prestar el servicio de fotocopiado.
            - paragraph [ref=e324]:
              - text: La Constancia del tipo “
              - strong [ref=e325]: EXENTO
              - text: ” para vehículos matriculados en la CDMX se expedirá sin costo.
            - paragraph [ref=e326]: Los vehículos con matrícula de otra entidad que lo soliciten de manera voluntaria deberán pagar la tarifa de 4.8 UMA´s más IVA ($630.00). No aplica para matrículas del Estado de México.
            - paragraph [ref=e327]:
              - text: Por la inspección físico - mecánica para la “revista vehicular” y la “validación vehicular”, se deberá presentar el vehículo en cualquiera de los
              - strong [ref=e328]: Centros de Verificación de Emisiones Vehiculares
              - text: de la Ciudad de México autorizados para el efecto, donde deberá cubrir el pago correspondiente que para tal efecto publique la Secretaría de Movilidad de la Ciudad de México.
              - text: La tarifa por las Constancias para los vehículos que participen en el Programa de Autorregulación Ambiental de Vehículos a Diésel o para impulsar la electromovilidad en vehículos ligeros, será la que establezca la Secretaría.
            - separator [ref=e329]
            - paragraph [ref=e330]
            - paragraph [ref=e331]:
              - strong [ref=e332]: CONSTANCIA DE VERIFICACIÓN QUE SE PUEDE OBTENER
            - paragraph [ref=e333]: Los hologramas que puedes obtener con el nuevo programa de Verificación Vehicular son los siguientes
            - paragraph [ref=e334]:
              - strong [ref=e335]: EXENTO
            - paragraph [ref=e336]:
              - text: Los propietarios o legales poseedores de los vehículos Eléctricos, Vehículos Híbridos Categoría I y II de cualquier uso deberán solicitar el incentivo del Holograma “
              - strong [ref=e337]: Exento
              - text: ” de forma gratuita, si se encuentren en la lista publicada en la página de internet de la Secretaría (Una vez que la información sea proporcionada por la Industria Automotriz y sea valorada por la Secretaría).
            - paragraph [ref=e338]:
              - text: El cual podrán solicitar en las áreas de atención ciudadana de los
              - strong [ref=e339]: Centros de Verificación de Emisiones Vehiculares
              - text: "autorizados en la Ciudad de México, siempre y cuando se cumpla con los requisitos siguientes:"
            - paragraph [ref=e340]:
              - strong [ref=e341]: a)
              - text: "Identificación oficial vigente con fotografía del solicitante, (ej.: credencial para votar o cédula profesional o pasaporte o licencia para conducir o cartilla del Servicio Militar Nacional o del"
              - strong [ref=e342]: INAPAM
              - text: ", entre otros). Copia."
            - paragraph [ref=e343]:
              - strong [ref=e344]: b)
              - text: Documento mediante el cual se acredite la primera enajenación del vehículo. Copia.
            - paragraph [ref=e345]:
              - strong [ref=e346]: c)
              - text: Tarjeta de circulación de la entidad en la que se encuentre registrado (Excepto del Estado de México). Copia.
            - paragraph [ref=e347]:
              - strong [ref=e348]: d)
              - text: Encontrarse dentro del
              - link "listado de vehículos candidatos al holograma Exento" [ref=e349] [cursor=pointer]:
                - /url: https://verificacionvehicular.sedema.cdmx.gob.mx/Listado/Exentos
                - strong [ref=e350]: listado de vehículos candidatos al holograma Exento
              - text: de la página de la Secretaría (www.sedema.cdmx.gob.mx).
            - paragraph [ref=e351]:
              - strong [ref=e352]: e)
              - text: "Cumplir con los criterios establecidos en la siguiente tabla:"
            - paragraph [ref=e353]
