            - paragraph [ref=e412]: "Los vehículos automotores que hayan sido convertidos a eléctricos también podrán solicitar la emisión a su favor del holograma referido, para lo cual, los propietarios o poseedores deberán presentar en el Área de Atención Ciudadana de Verificación Vehicular, sita en Río de la Plata # 48, Piso 2, colonia Cuauhtémoc, Alcaldía en Cuauhtémoc, C.P. 06500, en días hábiles de 9:00 a 14:00 horas:"
            - paragraph [ref=e413]:
              - strong [ref=e414]: 1)
              - text: Solicitud (Escrito Libre) por parte del legal poseedor del vehículo.
            - paragraph [ref=e415]:
              - strong [ref=e416]: "2"
              - strong [ref=e417]: )
              - text: Factura de la conversión a propulsión eléctrica.
            - paragraph [ref=e418]:
              - strong [ref=e419]: 3)
              - text: Evidencia que avale que la conversión de tecnología cumple con alguno de los estándares internacionales en seguridad de las conversiones como ISO 6469-1, ISO 6469-2, ISO 6469-3, ISO 6469-4, el cambio de tecnología.
            - paragraph [ref=e420]:
              - strong [ref=e421]: "4"
              - strong [ref=e422]: )
              - text: Tarjeta de circulación que indique que el vehículo es eléctrico (Excepto vehículos del Estado de México).
            - paragraph [ref=e423]: La vigencia del holograma, se calculará a partir de la fecha de emisión de la factura o evidencia del cambio de tecnología del vehículo.
            - separator [ref=e424]
            - paragraph [ref=e425]:
              - strong [ref=e426]: Constancia tipo “00”
            - paragraph [ref=e427]:
              - text: Constancia tipo
              - strong [ref=e428]: “00”
              - text: (Constancia de verificación tipo “00”). Este holograma se otorga como reconocimiento a los automotores cuyo desempeño ambiental es superior al establecido en la regulación nacional vigente, de acuerdo con las condiciones establecidas por la Ciudad de México.
            - paragraph [ref=e429]: Los propietarios o legales poseedores de vehículos de cualquier uso que utilicen gasolina, diésel, gas natural, gas licuado de petróleo, híbridos categoría III, que se encuentren en la lista publicada en la página de internet de la Secretaría (elaborada y actualizada con base en la información proporcionada por la industria automotriz), deberán acudir a cualquiera de los Centros de Verificación de Emisiones Vehiculares de la Ciudad de México a realizar el procedimiento de asignación del incentivo, debiendo cumplir con los siguientes valores obtenidos de la información proporcionada por los fabricantes de vehículos automotores a la Secretaría, señalados en los numerales 8.7.2.1. y 8.7.2.2.
