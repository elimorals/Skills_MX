        - generic [ref=e97]:
          - heading "Verificación Vehicular" [level=1] [ref=e99]
          - generic [ref=e100]:
            - paragraph
            - paragraph [ref=e101]: El presente programa es de observancia obligatoria para los vehículos automotores de combustión interna matriculados en la Ciudad de México, en otras entidades federativas o con matrícula federal que de manera voluntaria soliciten el servicio de verificación vehicular en la Ciudad de México, con excepción de los tractores agrícolas, la maquinaria dedicada a las industrias de la construcción y minera, las motocicletas, los vehículos con peso bruto vehicular menor o igual a 400 kilogramos, los vehículos eléctricos, vehículos híbridos categorías I y II mencionadas en el presente programa, los vehículos con matrícula de auto antiguo, así como los automotores con matrícula de demostración y/o traslado y aquellos cuya tecnología o dimensiones impida la aplicación de la Norma Oficial Mexicana correspondiente.
            - paragraph [ref=e102]:
              - text: Asimismo, quedan obligados a observar el presente programa, los titulares de los
              - strong [ref=e103]: Centro de Verificación
              - strong [ref=e104]: de Emisiones Vehiculares
              - text: de la Ciudad de México y los proveedores de equipo de verificación de emisiones vehiculares autorizados por la Secretaría del Medio Ambiente de la Ciudad de México.
            - separator [ref=e105]
            - paragraph [ref=e106]:
              - strong [ref=e107]: ⚠
              - strong [ref=e108]: ️ AVISOS
