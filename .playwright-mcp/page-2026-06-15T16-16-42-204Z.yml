            - paragraph [ref=e389]
            - paragraph [ref=e390]
            - paragraph [ref=e391]:
              - text: Al vencimiento de la vigencia del holograma tipo Exento otorgado a los vehículos híbridos categoría I y II, los propietarios o legales poseedores deberán solicitar en los
              - strong [ref=e392]: Centros de Verificación de Emisiones Vehiculares
              - text: la renovación del mismo, siempre y cuando se encuentre en el listado descrito en el inciso
              - strong [ref=e393]: d)
              - text: de este numeral.
            - paragraph [ref=e394]: La vigencia se calculará a partir de la fecha de emisión de la factura o carta factura, y/o contrato de arrendamiento del vehículo.
            - paragraph [ref=e395]: Para el caso de los vehículos que hayan obtenido una constancia tipo Exento, conforme a los criterios establecidos en los programas anteriores, será reconocida la vigencia otorgada en su momento. En caso de que su holograma no incluya vigencia, la misma se considera a partir de la adquisición del automotor.
            - paragraph [ref=e396]:
              - text: Los vehículos que hayan obtenido un holograma tipo
              - strong [ref=e397]: Exento
              - text: conforme a los criterios establecidos en los programas anteriores y cuya vigencia haya llegado a su fin, deberán someterse a los criterios actuales para realizar su renovación, o en su caso, para aquellos vehículos que no sean candidatos a la renovación de la constancia tipo
              - strong [ref=e398]: Exento
              - text: podrán verificar dentro de los 180 días naturales contados a partir de la fecha de término de la vigencia del holograma tipo
              - strong [ref=e399]: Exento
              - text: ", si transcurriera dicho plazo y no aprobara la verificación, deberán pagar multa por verificación extemporánea para poder verificar la unidad, debiendo respetar a partir de ese semestre, los calendarios establecidos para verificar semestralmente la unidad."
            - table [ref=e400]:
              - rowgroup [ref=e401]:
                - row [ref=e402]:
                  - cell [ref=e403]:
                    - link [ref=e404] [cursor=pointer]:
