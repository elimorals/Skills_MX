            - generic [ref=e43]:
              - paragraph [ref=e44]:
                - strong [ref=e45]: Misión
                - text: Nuestra misión, a través de la Tesorería, es dirigir los recursos financieros de la Hacienda Municipal hacia el logro y cumplimiento de los objetivos y programas del H. Ayuntamiento, implementando procesos administrativos necesarios encaminados a proporcionar un servicio adecuado y expedito al público; así como la correcta aplicación de las partidas presupuestales con estricto apego a las leyes y normatividad vigente para cada ejercicio.
              - paragraph [ref=e46]:
                - strong [ref=e47]: Visión
                - text: La Tesorería Municipal tiene la Visión de lograr una economía municipal fortalecida, que optimice el rendimiento de los recursos propios y asignados para afrontar la importante labor recaudatoria y de servicio. De tal manera, se ofrece a la ciudadanía, mejores servicios, distinguiéndose por la calidad en el desempeño de sus funciones.
