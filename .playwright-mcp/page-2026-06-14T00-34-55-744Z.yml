          - text: Trámites profesionales ahora 100% digitales
          - text: La Dirección General de Profesiones informa que, a partir del 17 de marzo de 2026, las constancias profesionales podrán tramitarse completamente en línea, de forma rápida, segura y sin necesidad de acudir de manera presencial.
