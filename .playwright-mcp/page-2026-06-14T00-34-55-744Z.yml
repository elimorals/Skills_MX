          - text: • e.firma vigente
          - text: • Tarjeta bancaria para pago en línea
          - text: "Además, recuerda que la expedición de cédula profesional y la solicitud de duplicados continúan disponibles en línea en:"
          - link "https://siurp.sep.gob.mx/mvc/cedulaElectronica" [ref=e69] [cursor=pointer]:
            - /url: https://siurp.sep.gob.mx/mvc/cedulaElectronica
