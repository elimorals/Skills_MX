                - paragraph [ref=f17e13]: "El presente servicio es brindado por el Instituto de Control Vehicular del Estado de Nuevo León y permite al usuario consultar el estado de cuenta y registro que guarda su vehículo, bajo las siguientes condiciones:"
                - paragraph [ref=f17e14]: 1. El servicio de consulta de estado de cuenta y registro vehicular es gratuito.
                - paragraph [ref=f17e15]: 2. El usuario deberá de proporcionar el número de placa para llevar a cabo la consulta.
                - paragraph [ref=f17e16]: 3. Durante el proceso de consulta no se entregarán datos personales, sensibles ni información confidencial
                - paragraph [ref=f17e17]: 4. Los fines de la consulta serán meramente informativos y estarán sujetos a las actualizaciones de la información en el sistema
                - paragraph [ref=f17e18]: 5. Dentro del proceso de la consulta, no se podrán realizar modificaciones en la información del vehículo, para lo anterior deberá de acercarse a su delegación de preferencia y cumplir con los requisitos aplicables para cada caso
                - paragraph [ref=f17e19]:
