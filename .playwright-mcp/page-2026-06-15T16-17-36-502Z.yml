            - text: Las velocidades comunicadas son en Megas (Megabits por segundo) y corresponden a la velocidad máxima de transferencia de datos ofrecida y alcanzable, la velocidad de bajada y subida podrá variar en función de las condiciones técnicas del módem, cantidad de dispositivos conectados simultáneamente y/o la distancia entre el domicilio del usuario y la central. A partir del 7o mes el cliente continuará con la velocidad de su paquete originalmente contratado. La velocidad aplica para usuarios activos sin adeudos en sus servicios de telecomunicaciones y nuevos que cuentan con fibra óptica instalada. Promoción de 100% de descuento en la renta de los meses 4, 8 y 12 (sobre servicio de telecomunicaciones) y promoción de descuento del 100% en gastos de instalación ($1,600 con impuestos), aplican para clientes que realizan el cambio de su servicio de telecomunicaciones a Telmex. Netflix estándar con anuncios o HBO Max básico con anuncios sin costo durante 6 meses. Todos los derechos reservados. A partir del 7°mes se pagará la renta del OTT. Netflix, HBO Max, Universal+ en Claro Video, Claro Drive, Infinitum Mail y Antivirus, son servicios proporcionados por un tercero. Plazos, condiciones, inscripciones IFT (ahora CRT) y velocidades promedio de descarga aplicables en
