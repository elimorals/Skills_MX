    - generic [ref=e40]:
      - heading "Aviso de privacidad" [level=6] [ref=e41]
      - paragraph [ref=e42]: El Municipio de Juárez a través de la Unidad Única de Transparencia del Municipio de Juárez con domicilio en Francisco Villa 950 Nte Col. Centro, Área de Sótano ala sur de la Unidad Administrativa “Lic. Benito Juárez” da a conocer a los usuarios el siguiente aviso de privacidad simplificado, en cumplimiento a lo dispuesto en el artículo 66 de la Ley de Protección de Datos Personales del Estado de Chihuahua. La finalidad para la cual serán recabados sus datos personales es para efectos de trámites administrativos, como pueden ser relativos a recursos financieros, patrimoniales, o fiscales, solicitudes para el ejercicio de los derechos de Acceso, Rectificación, Cancelación y Oposición de datos personales y de portabilidad los cuales serán tratados para las finalidades antes mencionadas para lo cual será necesario que usted otorgue su consentimiento al calce del presente. Los datos personales podrán ser transferidos a órganos de fiscalización estatales y federales, para lo cual será necesario que otorgue su consentimiento al calce del documento. El titular de los datos podrá manifestar su negativa al tratamiento y tratamiento de sus datos, ante la Unidad de Transparencia o por medio de la Plataforma Nacional de Transparencia http://www.plataformadetransparencia.org.mx. El presente aviso de privacidad integral estará disponible en www.juarez.gob.mx
