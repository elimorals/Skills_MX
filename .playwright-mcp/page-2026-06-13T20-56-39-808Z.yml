      - generic [ref=e83]:
        - generic [ref=e84]:
          - paragraph [ref=e85]:
            - text: Mexicali, capital de Baja California. La "ciudad que capturó al Sol", localizada a orillas del Río Colorado y cerca de la Laguna Salada. Mexicali es tradicional y moderna a la vez, con la mejor y mayor oferta de comida china del país, además de ser reconocida por sus excelentes cortes de carne y cerveza artesanal. Es una ciudad con grandes oportunidades para el desarrollo de turismo de negocios, turismo médico y actividades industriales.
            - text: Como una de las principales zonas industriales de Baja California, Mexicali se destaca por su dinamismo económico y por ser un punto estratégico para la industria manufacturera, aeroespacial y tecnológica. Además, es sede de la Agrobaja, la exposición agropecuaria y de pesca fronteriza más importante del país, consolidándose como un referente en el sector agrícola y comercial.
