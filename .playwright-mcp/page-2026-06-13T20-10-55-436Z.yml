                      - 'heading "¡inversión que genera ingresos! Propiedad con 3 viviendas independientes. Ubicación: Col. Ampliación Miguel Hidalgo, 4ta Sección. A solo 2 cuadras del Hospital General Ajusco Medio, en calle cerrada. Medidas: 197 m² de terreno / 171 m² de construcción. ¿Buscas estabilidad financiera? Esta propiedad es perfecta. Cuenta con tres departamentos totalmente independientes para que tú decidas cómo usarla: Tu espacio: Vive cómodamente en la primera vivienda (1 recámara, baño y cocina). Ingresos extra: Renta las otras dos unidades: Unidad 2: 3 recámaras, baño, cocina y sala-comedor. Unidad 3: 2 recámaras, baño, cocina, sala-comedor + área de lavado con baño extra. Todo lo que necesitas, listo para usar: Estacionamiento cubierto para 3 autos. Sistema de bomba de agua. 3 boilers y gas estacionario. Portón eléctrico." [level=2] [ref=e1700] [cursor=pointer]':
