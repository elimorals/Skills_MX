      - complementary [ref=e64]:
        - generic [ref=e65] [cursor=pointer]: Obligaciones de las instituciones financieras
        - paragraph [ref=e66]: EXENCIÓN DE RESPONSABILIDAD
        - paragraph [ref=e67]: Los Comprobantes Electrónicos de Pago se generan con base en la información proporcionada por las entidades receptoras de los pagos (Participantes Emisores de las Confirmaciones de Abono) bajo su responsabilidad exclusiva; se emiten con fines informativos y están dirigidos únicamente a los usuarios del Sistema de Pagos Electrónicos Interbancarios (SPEI®) relacionados con la Orden de Transferencia Aceptada correspondiente, por lo que Banco de México no tiene responsabilidad alguna sobre tal información.
        - paragraph [ref=e68]: Para obtener el Comprobante Electrónico de Pago de una Orden de Transferencia Aceptada, el usuario deberá proporcionar información confidencial cuyo acceso y uso fueron previamente pactados, entre la entidad que proporcione el servicio de transferencia electrónica vía SPEI® o la entidad que lleve la cuenta en que se depositaron los recursos, según corresponda, por lo que Banco de México no es responsable por el manejo que se dé o llegare a darse a los números de referencia, claves de rastreo y/o cualquier otro dato relacionado con el Comprobante Electrónico de Pago o con la Orden de Transferencia Aceptada respectivos.
        - paragraph [ref=e69]: Para mayor información o aclaraciones respecto del Comprobante Electrónico de Pago y/o de la Orden de Transferencia Aceptada, el usuario respectivo deberá consultar a la entidad que haya proporcionado el servicio de transferencia electrónica vía SPEI® o a la que lleve la cuenta en que se recibieron los recursos.
