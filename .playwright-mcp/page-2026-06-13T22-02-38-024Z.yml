      - paragraph [ref=e29]: Puedes llevar a cabo el pago de los diversos servicios que proporciona el Gobierno del Estado de México, ya sea en línea o a través de las ventanillas de los Centros Autorizados de Pago, lo anterior a efecto de acudir a la Dependencia correspondiente con tu comprobante de pago y los demás requisitos que se establezcan en cada trámite. Realiza tú pago en línea mediante transferencia si eres cliente de la banca electrónica; adicionalmente si pagas la Tenencia con Derechos de Control Vehicular, podrás efectuarlo con cargo a tu tarjeta Visa/Master Card emitida por cualquier Institución Financiera, American Express o Puntos BBVA. Tratándose del pago de Predial y Derechos derivados de la prestación de servicios por parte de Organismos Auxiliares, con tu tarjeta Visa/Master Card o Puntos BBVA.
