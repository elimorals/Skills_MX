    - generic [ref=e420]:
      - heading "Contigo Turismo" [level=2] [ref=e422]:
        - generic [ref=e423]: Contigo Turismo
      - generic [ref=e432]:
        - paragraph [ref=e433]:
          - text: Desde hace 500 años nos hacemos llamar Colimotes, porque nacimos en la cuna de Colimán, tierra fértil de colores, aromas, sabores y cielos azul turquesa. Somos la herencia de mujeres y hombres que trabajaron este suelo, creciendo junto a palmeras, montes, llanos y ríos.
          - text: La tierra del ticus, de las parotas, de las primaveras, de las sonrisas, de la calma, del calorcito por la tarde, de las noches bohemias. Somos la tuba, el bate, el tejuino, los parques y jardines, los centros comerciales. Tradición y modernidad, historia y novedad.
          - text: ¿A qué sabe Colima? A aire fresco, al susurro del río Colima, a palmeras y primaveras, a rosamorada, a guamúchil, a pitaya, a tamarindo, a jamaica, a chilayo, a tatemado y al dulce ante colimote.
          - text: ¿Por qué enamora esta tierra? Por su cielo claro, por sus montes verdes en el horizonte y las sonrisas de su gente. Porque desde donde estés parado, al mirar al norte se llenan tus ojos con la majestuosidad de los volcanes de Colima. Que no te lo cuenten. ¡Vívelo!
          - text: Y justo a 500 años, tenemos la oportunidad de construir un Colima en donde todas las acciones que se realicen sean en beneficio directo a las familias de éste hermoso municipio.
          - text: Quienes conformamos esta administración 2024-2027 del Ayuntamiento de Colima, estamos poniendo contigo manos a la obra por un Colima limpio, ordenado, próspero, pero sobre todo, por un Colima más humano.
          - text: ¡Viva Colima! ¡Ven a Colima! Come, ama, vive Colima.
        - paragraph
        - link "Visitar" [ref=e435] [cursor=pointer]:
          - /url: https://www.colima.gob.mx/portal/contigo-turismo/
