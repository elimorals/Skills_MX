            - paragraph
            - generic [ref=e145]: "*Los ahorros de los clientes de la banca están protegidos por un seguro de depósito, bajo la administración del IPAB, que cubre un monto de hasta 400,000 UDIs, de conformidad con los artículos 6 y 11 de la Ley de Protección y Ahorro Bancario."
            - generic [ref=e146]: "**Los ahorros de los socios de las Socaps están protegidos por un seguro de depósito, bajo la administración del Focoop, que cubre un monto de hasta 25,000 UDIs, de conformidad con el artículo 54 de la Ley para Regular las Actividades de las Sociedades Cooperativas de Ahorro y Préstamo."
            - generic [ref=e147]: "***Los ahorros de clientes y socios de las Sofipos y Sofincos están protegidos por un seguro de depósito, bajo la administración del Prosofipo, que cubre un monto de hasta 25,000 UDIs, de conformidad con el artículo 105 de la Ley Ahorro y Crédito Popular."
            - generic [ref=e148]:
              - generic [ref=e149]:
                - strong [ref=e150]: Nota
                - text: ": El total de entidades del sector SOFOM E.N.R., supervisadas exclusivamente en materia de PLD/FT por la CNBV, se actualiza a partir de la información proporcionada por la CONDUSEF, relativa a los registros renovados o creados conforme a la Ley General de Organizaciones y Actividades Auxiliares del Crédito."
              - generic [ref=e152]: Dado que los servicios informáticos que albergan el número de SOFOM E.N.R. están siendo actualizados por la CONDUSEF, las cifras pueden variar. Se recomienda consultar el Sistema de Registro de Prestadores de Servicios Financieros (SIPRES) como fuente principal para obtener la información actualizada.
