                - generic [ref=e843]:
                  - list [ref=e844]:
                    - listitem [ref=e845]:
                      - paragraph [ref=e846]: • -Como resultado de las acciones de prevención y vigilancia implementadas durante el Operativo “Cohetón 2025”, la Dirección Municipal de Protección Civil aseguró 383.7 kilogramos de pirotecnia, en coordinación con autoridades de los tres órdenes de gobierno. En las acciones del Operativo “Cohetón 2025”, la Dirección Municipal de Protección Civil informó el aseguramiento de 383.7 kilogramos de pirotecnia, derivado de los recorridos de inspección y verificación realizados en diversos puntos de la ciudad. Dichas acciones se llevaron a cabo en estrecha coordinación con autoridades de los tres órdenes de gobierno, como parte del compromiso institucional de prevenir riesgos y fortalecer las condiciones de seguridad durante la temporada decembrina. El operativo estuvo a cargo de células operativas compuestas por personal de la Dirección Municipal de Protección Civil, en coordinación con la Secretaría de la Defensa Nacional (DEFENSA), Policía Vial, Guardia Civil Estatal, Guardia Municipal y Protección Civil Estatal, quienes realizaron recorridos de inspección en los cinco cuadrantes de la ciudad, con el propósito de verificar que los puntos de venta de pirotecnia cumplieran con la normatividad vigente, las medidas de seguridad establecidas y contaran con los permisos correspondientes para su comercialización. Las acciones del Operativo “Cohetón” se desarrollaron los días 24, 30 y 31 de diciembre, fechas autorizadas para la venta de pirotecnia, con el objetivo de prevenir accidentes y salvaguardar a la población ante los riesgos inherentes al uso de estos artefactos. Durante las labores de supervisión se detectaron diversas irregularidades, entre las que destacan la comercialización de pirotecnia prohibida, el incumplimiento de la carta compromiso, la venta de cantidades superiores a las permitidas y la falta de permisos vigentes, lo que derivó en el aseguramiento del material. El producto decomisado fue trasladado al polvorín asignado para esta edición del operativo para posteriormente, ser entregado de manera formal a la Secretaría de la Defensa Nacional, instancia responsable de llevar a cabo su destrucción conforme a la normatividad aplicable. La Dirección Municipal de Protección Civil refrenda su compromiso con la seguridad y protección de la ciudadanía y continuará implementando operativos preventivos, así como acciones de supervisión permanente, a fin de reducir riesgos y atender de manera oportuna cualquier eventualidad que pudiera presentarse.
