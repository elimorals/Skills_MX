                  - list [ref=e822]:
                    - listitem [ref=e823]:
                      - paragraph [ref=e824]: "• El Alcalde Enrique Galindo destacó que con casi 384 kilos de pirotecnia asegurados y resultados positivos del programa de seguridad vial, el operativo de fin de año del Gobierno de la Capital, en coordinación con los tres niveles de gobierno, obtuvo resultados contundentes._ El aseguramiento de 383.7 kilogramos de pirotecnia durante el Operativo Cohetón 2025 representó la acción más contundente del Gobierno de la Capital para reducir riesgos y prevenir accidentes en la temporada decembrina, informó el Alcalde Enrique Galindo Ceballos, quien subrayó que “cada kilo retirado de las calles es una posibilidad menos de tragedia; nuestra prioridad es proteger la vida y la integridad de las familias potosinas”. El Presidente Municipal destacó también los resultados positivos del operativo Conducción Segura, donde se detectaron 5 estados de ebriedad y 17 alientos alcohólicos, y en todos los casos se activó el protocolo de resguardo, llamando a las familias de las y los conductores para que regresaran de manera segura a sus hogares: “No se trata solo de sancionar, sino de evitar accidentes y garantizar que todos lleguen con bien a casa”, enfatizó Galindo. El Alcalde explicó que el Operativo Cohetón 2025 se desplegó en los cinco cuadrantes de la ciudad mediante células interinstitucionales integradas por Protección Civil Municipal, la Secretaría de la Defensa Nacional (DEFENSA), Guardia Civil Estatal, Guardia Municipal, Policía Vial y Protección Civil Estatal. “La coordinación entre los tres órdenes de gobierno es lo que permite resultados reales y medibles”, afirmó. Precisó que las acciones se llevaron a cabo los días 24, 30 y 31 de diciembre, fechas autorizadas para la venta de pirotecnia, y que los aseguramientos derivaron de irregularidades como la comercialización de pirotecnia prohibida, la venta de cantidades superiores a las permitidas, el incumplimiento de la carta compromiso y la falta de permisos vigentes. “Aplicamos la norma con firmeza y con un enfoque preventivo”, señaló. Finalmente, Enrique Galindo informó que la pirotecnia decomisada fue trasladada al polvorín asignado y posteriormente entregada a la Secretaría de la Defensa Nacional para su destrucción conforme a la normatividad, y reiteró que el Gobierno de la Capital mantendrá operativos permanentes. “Seguiremos actuando con responsabilidad, anticipándonos a los riesgos y cuidando a San Luis Potosí”, concluyó. Adicionalmente, se presentó saldo blanco en los bares y antros que tuvieron horario extendido de operaciones en las primeras horas de este año, gracias al trabajo de la Dirección de Comercio Municipal en coordinación con diversas instancias."
