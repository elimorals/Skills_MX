                  - figure [ref=e593]:
                    - img "Durante 2025, SSPC de la Capital fortaleció la prevención de delitos cibernéticos y la alfabetización digital" [ref=e594]
                  - generic [ref=e595]:
                    - heading "31 DIC / 25" [level=3] [ref=e597]:
                      - text: "31"
                      - generic [ref=e598]: DIC / 25
                    - paragraph [ref=e600]: Durante 2025, SSPC de la Capital fortaleció la prevención de delitos cibernéticos y la alfabetización digital
                - generic [ref=e601]:
                  - list [ref=e602]:
                    - listitem [ref=e603]:
                      - paragraph [ref=e604]: ● Durante 2025, a través de la Dirección de Tecnologías e Inteligencia Social, se impulsó la política pública Defensores Digitales, logrando impactar a 13 mil 312 personas en la capital potosina. ● En materia de ciberinteligencia, durante el año se atendieron un total de 6 mil 231 incidentes informáticos. La Secretaría de Seguridad y Protección Ciudadana (SSPC), a través de la Dirección de Tecnologías e Inteligencia Social, impulsó durante 2025 la política pública Defensores Digitales, orientada a la alfabetización digital de docentes, estudiantes, madres y padres de familia, así como de personal de empresas y dependencias gubernamentales, con el objetivo de prevenir y detectar delitos cibernéticos. Esta estrategia innovadora se enfocó en fortalecer la educación y la prevención en entornos escolares, así como en capacitar a familias y cuidadores para que conozcan cómo actuar ante incidentes cibernéticos que puedan afectar a niñas, niños y adolescentes. Durante el año, personal de la Dirección de Tecnologías e Inteligencia Social acudió a universidades, empresas, planteles educativos y oficinas públicas para generar vínculos de proximidad y fomentar el uso seguro y responsable del ciberespacio. En total, se logró impactar a 13 mil 312 personas en la capital potosina. En materia de ciberinteligencia, la Dirección de Tecnologías e Inteligencia Social atendió durante 2025 un total de 6 mil 231 incidentes informáticos, entre los que destacan casos de cobranza ilegal, hackeo de cuentas de WhatsApp, difamación, llamadas de extorsión, suplantación de identidad, sextorsión y difusión ilícita de contenido. Asimismo, se logró el rescate y localización de siete personas privadas de la libertad mediante secuestro virtual, además de la eliminación de 510 páginas reportadas por posibles hechos ilícitos. Finalmente, la Secretaría de Seguridad y Protección Ciudadana refrenda su compromiso permanente con la seguridad digital y la protección de la ciudadanía, destacando que el personal de la Dirección de Tecnologías e Inteligencia Social se mantiene en capacitación constante y especializada en materia de ciberseguridad, a fin de fortalecer sus capacidades operativas y dar respuesta oportuna a los desafíos que presenta el entorno digital.
