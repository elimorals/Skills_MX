                    - img "Con más de 150 toneladas de basura recolectada cierra diciembre la delegación de Bocas" [ref=e550]
                  - generic [ref=e551]:
                    - heading "31 DIC / 25" [level=3] [ref=e553]:
                      - text: "31"
                      - generic [ref=e554]: DIC / 25
                    - paragraph [ref=e556]: Con más de 150 toneladas de basura recolectada cierra diciembre la delegación de Bocas
                - generic [ref=e557]:
                  - list [ref=e558]:
                    - listitem [ref=e559]:
                      - paragraph [ref=e560]: "- “Atendemos la instrucción del Alcalde Enrique Galindo de garantizar servicios básicos en la zona rural”: Delegado Jaime Waldo Luna. - La limpieza y mantenimiento de contenedores se realiza de manera constante y exhorta a la población a apoyar en su cuidado. El Delegado de Bocas, Jaime Waldo Luna, dio a conocer que en materia de recolección se concluyó diciembre con más de 150 toneladas de desechos recolectados, debido a las acciones constantes de limpieza y mantenimiento en los sitios donde se ubican los contenedores para basura doméstica. Y como parte de atender la instrucción del Alcalde Enrique Galindo Ceballos, el funcionario capitalino puntualizó además que para garantizar los servicios básicos también en la zona rural, se da prioridad precisamente a los depósitos que se ubican en las comunidades, los que ya están debidamente identificados por habitantes de cada poblado. Estas labores implicaron también más de 90 acciones de limpieza constante y de recolección, precisamente en los contenedores que están distribuidos en localidades y puntos estratégicos de la demarcación, por parte de personal de la delegación, a quienes aprovechó para hacerles un reconocimiento debido a su labor diaria aún en días festivos. Waldo Luna recordó que estos depósitos móviles instalados en distintas comunidades se vacían de manera periódica para mantener el orden y mejorar el manejo de residuos, además para evitar focos de contaminación. Finalmente, el Delegado de Bocas exhortó a las potosinas y potosinos que viven en esta zona del Municipio de San Luis Potosí a cuidar y usar de manera correcta los contenedores, avisar cuando estén llenos al teléfono: 4448-636073, pero a la par, evitar la quema de basura para que no haya incendios en pastizales."
