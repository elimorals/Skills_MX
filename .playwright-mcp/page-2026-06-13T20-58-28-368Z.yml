                - generic [ref=e614]:
                  - figure [ref=e615]:
                    - img "En un año crece 35% la participación en los Centros de Desarrollo Comunitario de San Luis Potosí" [ref=e616]
                  - generic [ref=e617]:
                    - heading "31 DIC / 25" [level=3] [ref=e619]:
                      - text: "31"
                      - generic [ref=e620]: DIC / 25
                    - paragraph [ref=e622]: En un año crece 35% la participación en los Centros de Desarrollo Comunitario de San Luis Potosí
                - generic [ref=e623]:
                  - list [ref=e624]:
                    - listitem [ref=e625]:
                      - paragraph [ref=e626]: "- ⁠Se rehabilitaron los 13 CDC de la ciudad. - Más actividades, más maestros voluntarios y programas para la niñez y las familias. En un año, la participación en los Centros de Desarrollo Comunitario (CDC) de San Luis Potosí aumentó en un 35 por ciento, informó el director de Centros de Desarrollo y Vinculación, Ignacio Delgado Pérez, quien subrayó que este esfuerzo del Gobierno Municipal que encabeza el alcalde Enrique Galindo Ceballos ha permitido que más familias tengan acceso a actividades deportivas, artísticas, culturales y sociales en espacios renovados y de calidad. Delgado Pérez detalló que los 13 CDC de la ciudad —Valle Dorado, Simón Díaz, Progreso, Pedrera de Guadalupe, San Juan de Guadalupe, Infonavit Morales, Jardines de Jacarandas, Rural Atlas, San Ángel 1 y 2, Tangamanga II, Ponciano Arriaga y Terremoto— fueron rehabilitados para ofrecer mejores instalaciones a sus usuarias y usuarios. Además, se incrementó en un 60 por ciento el número de actividades y de maestros voluntarios que enriquecen la oferta comunitaria. El director destacó también la realización de programas especiales como el Campamento de Verano y el Campamento de Invierno, que brindaron espacios de aprendizaje y recreación para niñas, niños y adolescentes. Asimismo, se implementó el programa Viernes de Recreo, diseñado para apoyar a madres y padres de familia que trabajan y que no tienen dónde dejar a sus hijos durante los Consejos Técnicos Escolares, un viernes al mes, cuando no se imparten clases en las escuelas. “Los Centros de Desarrollo Comunitario son espacios que fortalecen el tejido social, promueven la convivencia y ofrecen oportunidades de crecimiento para todas las familias potosinas”, señaló Delgado Pérez."
