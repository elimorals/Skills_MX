                  - figure [ref=e703]:
                    - img "Gestiones del Regidor Rubén Lárraga Benavente dan resultado y reactivan “Casa de Salud” en Rinconada" [ref=e704]
                  - generic [ref=e705]:
                    - heading "31 DIC / 25" [level=3] [ref=e707]:
                      - text: "31"
                      - generic [ref=e708]: DIC / 25
                    - paragraph [ref=e710]: Gestiones del Regidor Rubén Lárraga Benavente dan resultado y reactivan “Casa de Salud” en Rinconada
                - generic [ref=e711]:
                  - list [ref=e712]:
                    - listitem [ref=e713]:
                      - paragraph [ref=e714]: "- Habitantes de esta comunidad cuentan ya con servicios médicos y medicinas sin costo. - Resalta la importancia de los acercamientos con la ciudadanía para coadyuvar en la atención de peticiones sociales. Como parte de las gestiones atendidas por parte del Regidor del Ayuntamiento de San Luis Potosí, Rubén Omar Lárraga Benavente, se reactivó la denominada “Casa de Salud” para beneficio de habitantes de la comunidad de Rinconada. Explicó que después de varios acercamientos con la población de esta localidad, entre sus peticiones más sentidas resaltó precisamente, el contar con un espacio en donde recibieran atención médica de manera constante, “por lo que procedimos a lograr los acuerdos necesarios para hacer posible esta solicitud ciudadana”. Primeramente y junto con vecinas y vecinos se procedió a la limpieza, mantenimiento y a la rehabilitación del citado espacio, y una vez que quedó en condiciones para operar, entró en funcionamiento con servicios médicos gratuitos, a la par, de proporcionar los medicamentos sin costo también. “El objetivo es mantenerlo abierto para que de manera frecuente, quienes viven en Rinconada reciban atención médica en su mismo entorno, además de facilitarles las medicinas recetadas, de ahí la importancia de las reuniones con distintos sectores de la ciudad, para apoyarles en la resolución de sus requerimientos más inmediatos”, subrayó el Regidor capitalino, Rubén Lárraga. Finalmente, el también Presidente de la Comisión edilicia de Gobernación reveló que se espera en las próximas semanas habilitar un servicio más en la “Casa de Salud”, aunque relacionado con asesorías legales totalmente gratuitas para quienes lo necesiten, para dar respuesta a otra petición de las potosinas y potosinos que viven en esta zona."
