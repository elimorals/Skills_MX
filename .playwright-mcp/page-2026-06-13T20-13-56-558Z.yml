                      - paragraph [ref=e617]: Puebla, Pue., 5 de junio de 2026.- Como parte de las acciones permanentes para mantener una ciudad más limpia y ordenada el presidente municipal, Pepe Chedraui, supervisó la Jornada de Limpieza realizada en la zona de Puente de México, sobre el bulevar Forjadores, donde personal del Gobierno de la Ciudad llevó a cabo labores de barrido, retiro de residuos y mantenimiento de espacios públicos. Afirmó que el Gobierno de la Ciudad continuará impulsando jornadas de limpieza en distintos puntos de la capital para fortalecer el cuidado del entorno urbano y fomentar la participación ciudadana en la conservación de los espacios comunes.
