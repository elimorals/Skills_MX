            - listitem [ref=e579]:
              - article "Con éxito, el Gobierno de Pepe Chedraui realizó el Primer Reciclatón Municipal 2026" [ref=e580]:
                - 'link "Leer noticia: Con éxito, el Gobierno de Pepe Chedraui realizó el Primer Reciclatón Municipal 2026. Publicada el 6 de junio, 2026" [ref=e581] [cursor=pointer]':
                  - /url: /noticias/capital-imparable/con-exito-el-gobierno-de-pepe-chedraui-realizo-el-primer-reciclaton-municipal-2026
                  - generic [ref=e584]:
                    - paragraph [ref=e586]:
                      - time [ref=e587]: 6 de junio, 2026
                    - generic [ref=e588]:
                      - heading "Con éxito, el Gobierno de Pepe Chedraui realizó el Primer Reciclatón Municipal 2026" [level=3] [ref=e589]
                      - paragraph [ref=e591]: _La suma de esfuerzos entre dependencias, ciudadanía y aliados estratégicos fortalece el programa Canchas x Latas _Se reconoció públicamente a las empresas e instituciones aliadas por su compromiso con el programa Canchas x Latas y la promoción de la cultura ambiental Puebla, Pue., 06 de junio de 2026. En el marco del Día Mundial del Medio Ambiente y como parte de las acciones del programa Canchas x Latas, el Gobierno de la Ciudad, encabezado por el alcalde, Pepe Chedraui, a través del Instituto Municipal del Deporte de Puebla, dirigido por Ricardo Zayas Gallardo, llevó a cabo con gran éxito el Primer Reciclatón Municipal 2026, una jornada que reunió a dependencias municipales, aliados estratégicos y ciudadanía comprometida con el cuidado del medio ambiente. El objetivo de esta iniciativa fue generar un espacio de participación colectiva donde las distintas dependencias del Gobierno de la Ciudad, así como instituciones y aliados de los sectores público y privado, realizaran su aportación de latas de aluminio y material reciclable, fortaleciendo así una de las estrategias más innovadoras de responsabilidad social y sustentabilidad en la capital poblana. Durante la jornada se registró una destacada participación de dependencias y entidades municipales, cuyos equipos de trabajo se sumaron activamente a la recolección de materiales reciclables, demostrando que el compromiso con el medio ambiente y el bienestar comunitario es una responsabilidad compartida. Durante el evento protocolario, el Instituto Municipal del Deporte de Puebla entregó reconocimientos a las empresas e instituciones aliadas que han respaldado el programa Canchas x Latas, destacando su compromiso con la sustentabilidad, la responsabilidad social y la construcción de una cultura ambiental participativa. Este reconocimiento simboliza el valor de la colaboración entre gobierno, iniciativa privada y sociedad para impulsar proyectos que generan beneficios tangibles para las y los ciudadanos de la capital. En su mensaje, el director del Instituto Municipal del Deporte de Puebla, Ricardo Zayas Gallardo, agradeció el respaldo de todas las dependencias municipales y destacó que cada lata recolectada representa una oportunidad para seguir transformando espacios públicos y fomentar la participación ciudadana. “Somos el primer Ayuntamiento en México en lanzar una iniciativa de este tipo, es un proyecto que tiene impacto ambiental, social porque une a la comunidad entorne a este objetivo e impacto deportivo y urbano, gracias a todos ustedes por confiar, por sumarse a esta iniciativa. Este reciclatón no marco el final de esta colecta, estamos muy cerca de completar las latas necesarias para renovar la primera cancha”, puntualizó. Asimismo, reconoció el entusiasmo y la disposición mostrada por las y los servidores públicos, quienes respondieron al llamado con una importante aportación de latas y materiales reciclables, consolidando una jornada ejemplar de colaboración institucional. Como parte de las actividades complementarias, las familias asistentes disfrutaron de retas de fútbol 3 contra 3, un intercambio masivo de estampas del álbum del Mundial 2026 y una firma de autógrafos con destacadas figuras del deporte y el entretenimiento deportivo, entre ellas las luchadoras profesionales mexicanas Lady Tiger y Dixon, así como los exfutbolistas Carlos Poblete y Pablo González. Con acciones como esta, el Gobierno de la Ciudad refrenda su compromiso de impulsar programas que promuevan el reciclaje, la cultura ambiental, la convivencia comunitaria y el deporte como herramientas de transformación social, consolidando a Puebla como una ciudad que apuesta por la sustentabilidad y la participación ciudadana.
            - listitem [ref=e592]:
              - article "Encabeza Pepe Chedraui jornada de reforestación en Ecocampus BUAP" [ref=e593]:
                - 'link "Leer noticia: Encabeza Pepe Chedraui jornada de reforestación en Ecocampus BUAP. Publicada el 5 de junio, 2026" [ref=e594] [cursor=pointer]':
                  - /url: /noticias/capital-imparable/encabeza-pepe-chedraui-jornada-de-reforestacion-en-ecocampus-buap
                  - generic [ref=e597]:
                    - paragraph [ref=e599]:
                      - time [ref=e600]: 5 de junio, 2026
                    - generic [ref=e601]:
                      - heading "Encabeza Pepe Chedraui jornada de reforestación en Ecocampus BUAP" [level=3] [ref=e602]
                      - paragraph [ref=e604]: "- Desde el Gobierno de la Ciudad se plantarán más de 10 mil árboles para reverdecer Puebla capital Puebla, Pue., 5 de junio de 2026.- Con el objetivo de crear nuevos espacios verdes y fortalecer el compromiso ambiental del municipio, el Gobierno de la Ciudad, que encabeza el presidente municipal, Pepe Chedraui, en coordinación con la Benemérita Universidad Autónoma de Puebla (BUAP), llevó a cabo una jornada de reforestación masiva en el Ecocampus de la máxima casa de estudios. El alcalde encabezó esta acción ambiental en un polígono de 10 hectáreas, donde se logrará la plantación de más de 10 mil árboles. Esta iniciativa busca generar nuevos pulmones verdes que contribuyan a mejorar la calidad del aire, favorecer la captación de agua y promover la biodiversidad en la capital poblana. Para alcanzar este resultado, el Gobierno de la Ciudad, colaboró con la apertura de más de 10 mil cepas y aportará la plantación de más de siete mil árboles. A este esfuerzo se sumaron tres mil ejemplares producidos en el Jardín Botánico de la BUAP, bajo el trabajo de profesores investigadores de la universidad, consolidando así una alianza estratégica entre academia y gobierno. Los árboles a plantar en este polígono serán:* 3 mil 388 agaves* 2 mil 258 sabinos* 3 mil 387 encinos* 2 mil 258 tronadoras Al respecto, el secretario de Medio Ambiente del Municipio, Iván Herrera, destacó la importancia de la corresponsabilidad ciudadana y del trabajo conjunto para construir una ciudad más sostenible. “Cada uno de estos ejemplares es un compromiso con las próximas generaciones de poblanas y poblanos. Desde la Secretaría de Medio Ambiente seguiremos impulsando acciones que hagan de Puebla una ciudad más verde, resiliente y sostenible”, expresó. Con estas acciones, el Gobierno de la Ciudad y la BUAP refrendan su compromiso con el derecho de todas y todos para un medio ambiente sano."
