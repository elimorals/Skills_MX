      - generic [ref=e204]:
        - generic [ref=e206]:
          - generic [ref=e207]:
            - generic [ref=e209]: ¿Tienes alguna duda? Comunícate con nosotros
            - heading "Dudas y/o Preguntas Frecuentes" [level=3] [ref=e210]:
              - generic [ref=e212]: Dudas y/o Preguntas Frecuentes
          - generic [ref=e213]:
            - heading "¿ Qué es el Predial ?" [level=5] [ref=e214]:
              - strong [ref=e215]: ¿ Qué es el Predial ?
            - paragraph [ref=e216]: El predial es un impuesto que deben pagar las personas que sean propietarias o poseedoras de bienes inmuebles.
            - heading "¿ Qué es la avalúo catastral ?" [level=5] [ref=e217]:
              - strong [ref=e218]: ¿ Qué es la avalúo catastral ?
            - paragraph [ref=e219]: El avalúo catastral es el acto mediante el cual se determina el valor de los predios, considerando el valor del terreno y construcciones adheridas a éstos. Dicho valor sirve de sustento para establecer la base gravable del impuesto predial y, en consecuencia, fijar el monto a cargo del particular.
            - heading "¿ Qué es el DAP ?" [level=5] [ref=e220]:
              - strong [ref=e221]: ¿ Qué es el DAP ?
            - paragraph [ref=e222]: Es el cobro del Derecho de Alumbrado Público (DAP) por el servicio de alumbrado público que se preste en las calles, plazas, jardines y todos aquellos lugares de uso común, y los ingresos que se perciban por su recaudación se destinarán al pago de dicho servicio y en su caso, a su mantenimiento y mejoramiento, en colaboración con los contribuyentes beneficiados.
            - paragraph [ref=e223]: "Fundamento legal: Artículo 228-H, I, J,K y L de Ley de Hacienda para los Municipios del Estado de Guanajuato."
        - generic [ref=e226]:
          - generic [ref=e227]:
            - generic [ref=e228] [cursor=pointer]: ¿ Para qué se paga el impuesto predial ? 
            - paragraph [ref=e230]: La función principal de este impuesto es generar recursos para que los gobiernos municipales puedan proveer servicios públicos a nivel local, tales como alumbrado, pavimentación, recolección de residuos, seguridad, etcétera.
          - generic [ref=e231]:
            - generic [ref=e232] [cursor=pointer]: ¿Cuál es el fundamento del cobro del impuesto Predial? 
            - paragraph [ref=e234]: “Artículos 36 fracción I y 115 fracción IV inciso a) de la Constitución Política de los Estados Unidos Mexicanos. Artículo 161 de la Ley de Hacienda para los Municipios del Estado de Guanajuato. Artículo 4 y 5 de la Ley de Ingresos para el Municipio de Celaya, Guanajuato. ”
          - generic [ref=e235]:
            - generic [ref=e236] [cursor=pointer]: ¿Cómo se calcula el impuesto predial? 
            - paragraph [ref=e238]: El impuesto predial se calcula tomando como base gravable el valor catastral del inmueble. El valor catastral se obtiene a través de la práctica de un avalúo, que se compone de los valores unitarios del suelo y la construcción. A dicha base se le aplica la tasa correspondiente contenida en el artículo 4 de la Ley de Ingresos para el Municipio de Celaya, Guanajuato.
          - generic [ref=e239]:
            - generic [ref=e240] [cursor=pointer]: ¿Dónde puedo pagar mi impuesto predial? 
            - paragraph [ref=e242]: "En Cajas ubicadas en las instalaciones de la Dirección de Ingresos ubicada en calle Pípila #146 primero piso, zona centro y en Presidencia Municipal de Celaya, así como en los diferentes bancos, farmacias, tiendas de conveniencia o establecimientos publicados en la página www.celaya.gob.mx así también a través de la APP Celaya Móvil."
          - generic [ref=e243]:
            - generic [ref=e244] [cursor=pointer]: ¿Qué son los Derechos de Valuación y porque se cobran? 
            - paragraph [ref=e246]: Es el pago de derechos establecido en la Ley de Ingresos para el Municipio de Celaya, Guanajuato, por la realización de un avalúo catastral, cuando existan nuevas construcciones, reconstrucciones o ampliación de las construcciones ya existentes de los inmuebles o bien cuando el contribuyente lo solicite
          - generic [ref=e247]:
            - generic [ref=e248] [cursor=pointer]: Recibí un documento de la Tesorería Municipal por Correos de México y/o del personal adscrito a la Tesorería. ¿Qué es? 
            - paragraph [ref=e250]: Es el resultado del avalúo catastral, en el cual se asigna el valor del inmueble en base a las superficies de terreno y construcción registradas. Así también la liquidación del impuesto predial en la que se determina el impuesto a pagar en base al valor del inmueble y tasa correspondiente.
          - generic [ref=e251]:
            - generic [ref=e252] [cursor=pointer]: No estoy de acuerdo con el resultado del avalúo que me practicaron, ¿A dónde puedo acudir a manifestar mi inconformidad? 
            - paragraph [ref=e254]: "Acudir presencialmente a la ventanilla de “Atención Catastral” en la Dirección de Impuestos Inmobiliarios y Catastro, de la Presidencia Municipal, ubicada en Portal Independencia #101 altos, zona centro, con identificación oficial y avalúo vigente del cual está inconforme. O bien hablar al número telefónico 461 6187100 ext. 7339 para obtener una cita de atención en oficina."
          - generic [ref=e255]:
            - generic [ref=e256] [cursor=pointer]: No estoy de acuerdo con el cobro del impuesto Predial que me hacen ¿A dónde puedo acudir a manifestar mi inconformidad? 
            - paragraph [ref=e258]: "Acudir presencialmente a la Dirección de Impuestos Inmobiliarios y Catastro, de la Presidencia Municipal, ubicada en Portal Independencia #101 altos, zona centro, o a la Dirección de Ingresos, ubicada en calle Pípila #146 primer piso, zona centro, con identificación oficial y documento del cual está inconforme."
          - generic [ref=e259]:
            - generic [ref=e260] [cursor=pointer]: ¿Me pueden cobrar impuestos o derechos de manera retroactiva? 
            - paragraph [ref=e262]: Si, de acuerdo con lo establecido en el artículo 167 de la Ley de Hacienda para los Municipios del estado de Guanajuato.
          - generic [ref=e263]:
            - generic [ref=e264] [cursor=pointer]: Soy pensionado(a) y/o jubilado(a), viudo(a) , tercera edad o concubino(a) de estos, ¿Tengo derecho a algún descuento en el pago del impuesto predial? 
            - paragraph [ref=e266]:
              - text: Jubilados, pensionados, cónyuge, concubino , viudo o personas de la tercera edad. Pueden solicitar el beneficio de la
              - link "CUOTA MÍNIMA" [ref=e267] [cursor=pointer]:
                - /url: https://www.celaya.gob.mx/pago-de-predial/cuota-minima/
              - text: ", aplicable para una sola propiedad y deberá tramitarse en la Dirección de Impuestos Inmobiliarios y Catastro, ubicada en la Presidencia Municipal."
          - generic [ref=e268]:
            - generic [ref=e269] [cursor=pointer]: ¿Es obligatorio el donativo a la Cruz Roja Mexicana? 
            - paragraph [ref=e271]: El donativo a la Cruz Roja Mexicana no es obligatorio.
