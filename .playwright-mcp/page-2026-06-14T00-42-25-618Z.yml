        - generic [ref=e97]:
          - heading "Hoy No Circula" [level=1] [ref=e99]
          - generic [ref=e100]:
            - paragraph
            - paragraph [ref=e101]: Establecer medidas aplicables a la circulación vehicular de fuentes móviles o vehículos automotores, con el objetivo de prevenir, minimizar y controlar la emisión de contaminantes provenientes de fuentes móviles que circulan en la Ciudad de México sea cual fuere el origen de las placas y/o matrícula del vehículo, mediante la limitación de su circulación.
        - img "hoynocirculan.jpg" [ref=e104]
        - generic [ref=e105]:
          - tab "Objetivo " [ref=e106]:
            - heading "Objetivo" [level=2] [ref=e108]
            - link "" [expanded] [ref=e110] [cursor=pointer]:
              - /url: "#collapse1"
          - tabpanel [ref=e111]:
            - generic [ref=e112]:
              - paragraph [ref=e113]:
                - strong [ref=e114]: Conoce el
                - link "Decreto por el que se expide el Programa Hoy No Circula" [ref=e115] [cursor=pointer]:
                  - /url: https://www.sedema.cdmx.gob.mx/storage/app/media/programas/hoy-no-circula/decreto-programa-hoy-no-circula-segundo-semestre-2016.pdf
                  - strong [ref=e116]: Decreto por el que se expide el Programa Hoy No Circula
              - paragraph [ref=e117]:
                - strong [ref=e118]: Ámbito de aplicación del programa
              - paragraph [ref=e119]: "El presente Programa rige en todo el territorio de la Ciudad de México, para dicho efecto, las medidas aplicables a la circulación vehicular de las fuentes móviles o vehículos automotores deberá ajustarse a los siguientes criterios:"
              - paragraph [ref=e120]:
                - strong [ref=e121]: I.-
                - text: Días
              - paragraph [ref=e122]:
                - strong [ref=e123]: II.-
                - text: Horarios
              - paragraph [ref=e124]: La aplicación del presente Programa corresponde a la Secretaría del Medio Ambiente de la Ciudad de México. En todo lo no previsto en el presente Programa, se aplicarán las disposiciones contenidas en otras leyes, reglamentos, normas y demás ordenamientos jurídicos relacionados con la materia que incidan en este instrumento.
              - paragraph [ref=e125]: Además de las medidas establecidas en el presente Programa, se podrán determinar y establecer a través de otros programas, días y horarios, a los que deberá ajustarse la circulación vehicular de las fuentes móviles o vehículos automotores en la Ciudad de México.
              - paragraph [ref=e126]:
                - strong [ref=e127]
              - paragraph [ref=e128]:
                - strong [ref=e129]: DISPOSICIONES COMPLEMENTARIAS DEL PROGRAMA “HOY NO CIRCULA”
              - paragraph [ref=e130]: "Además de lo establecido en el numeral VII del Programa Hoy No Circula se encuentran exentos de las limitaciones los siguientes supuestos:"
              - paragraph [ref=e131]:
                - strong [ref=e132]: I.-
                - text: Tractores agrícolas.
              - paragraph [ref=e133]:
                - strong [ref=e134]: II.-
                - text: Maquinaria dedicada a las industrias de la construcción y minera.
              - paragraph [ref=e135]:
                - strong [ref=e136]: III.-
                - text: Motocicletas.
              - paragraph [ref=e137]:
                - strong [ref=e138]: IV.-
                - text: Vehículos con peso bruto vehicular menor o igual a 400 kilogramos.
              - paragraph [ref=e139]:
                - strong [ref=e140]: V.-
                - text: Vehículos eléctricos.
              - paragraph [ref=e141]:
                - strong [ref=e142]: VI.-
                - text: Vehículos híbridos categoría I y II con motores de propulsión a gasolina y eléctrico.
              - paragraph [ref=e143]:
                - strong [ref=e144]: VII.-
                - text: Vehículos con matrícula de auto antiguo y/o clásico.
              - paragraph [ref=e145]:
                - strong [ref=e146]: VIII.-
                - text: Automotores con matrícula de demostración y/o traslado.
              - paragraph [ref=e147]:
                - strong [ref=e148]: IX.-
                - text: Vehículos cuya tecnología impida la aplicación de la Norma Oficial Mexicana correspondiente.
              - paragraph [ref=e149]:
                - strong [ref=e150]: X.-
                - text: Vehículos que porten Holograma “EXENTO”.
              - paragraph [ref=e151]:
                - strong [ref=e152]: XI.-
                - text: Vehículos que porten Constancia de Verificación y holograma tipo “00” por dos años, salvo cuando exista contingencia ambiental atmosférica por contaminantes y la
                - strong [ref=e153]: CAMe
                - text: emita restricciones a la circulación para alguno de los casos referidos.
              - paragraph [ref=e154]:
                - strong [ref=e155]: XII.-
                - text: Vehículos que porten Constancia de Verificación y holograma tipo “0”, por seis meses, salvo cuando exista contingencia ambiental atmosférica por contaminantes y la
                - strong [ref=e156]: CAMe
                - text: emita restricciones a la circulación para alguno de los casos referidos.
              - paragraph [ref=e157]:
                - strong [ref=e158]: XIII.-
                - text: Vehículos que porten Constancia tipo “Permiso Especial para Circular”, siempre y cuando transporten a personas con discapacidad.
              - paragraph [ref=e159]:
                - strong [ref=e160]: XIV.-
                - text: Vehículos que porten Constancia tipo “Autorregulación”, que participen en el Programa de Autorregulación Ambiental de vehículos a diésel o para impulsar la electromovilidad en vehículos ligeros.
              - paragraph [ref=e161]:
                - strong [ref=e162]: XV.-
                - text: Vehículos que porten placas para personas con discapacidad.
              - paragraph [ref=e163]:
                - strong [ref=e164]: XVI.-
                - text: Vehículos que porten Pase Turístico Metropolitano, dos veces por semestre por siete días, una vez por semestre por 14 días, Vehículos que porten Pase Turístico Paisano durante la activación de puentes largos oficiales y durante la activación del Programa Paisano.
              - paragraph [ref=e165]:
                - strong [ref=e166]: XVII.-
                - text: Vehículos que porten los oficios de Ampliación al Periodo de Verificación Vehicular, en la vigencia establecida en dicho oficio, emitidos por la Secretaría.
              - paragraph [ref=e167]:
                - strong [ref=e168]: XVIII.-
                - text: Vehículos que porten en lugar visible oficio emitido por la Secretaría del Medio Ambiente de la Ciudad de México, para exentar las limitaciones a la circulación.
              - paragraph [ref=e169]:
                - img [ref=e170]
              - paragraph [ref=e171]:
                - img [ref=e172]
              - separator [ref=e173]
              - paragraph [ref=e174]:
                - strong [ref=e175]: Programa para Prevenir y Responder a Contingencias Ambientales Atmosféricas. (Apartado Hoy no Circula).
              - paragraph [ref=e176]:
                - strong [ref=e177]: Fase Preventiva
              - list [ref=e178]:
                - listitem [ref=e179]: Dejan de circular 50% de los automotores administrativos de gobiernos locales, municipales, alcaldías y federal
              - paragraph [ref=e180]:
                - strong [ref=e181]: Fase 1
              - list [ref=e182]:
                - listitem [ref=e183]: Dejan de circular 100% de los automotores administrativos de gobiernos locales, municipales, alcaldías y federal
                - listitem [ref=e184]: Dejan de circular el 20% de los hologramas “00”, “0” de acuerdo a la terminación de su placa, nones o pares de holograma “1” y el 100% de los hologramas “2”
              - paragraph [ref=e185]
              - paragraph [ref=e186]:
                - strong [ref=e187]:
                  - emphasis [ref=e188]:
                    - text: Consulta el Programa
                    - strong [ref=e189]: para Prevenir y Responder a Contingencias Ambientales Atmosféricas en la Ciudad de México
              - paragraph [ref=e190]:
                - strong [ref=e191]:
                  - link "https://data.consejeria.cdmx.gob.mx/portal_old/uploads/gacetas/25a1ef7295458ade0faad3daebb31f05.pdf" [ref=e192] [cursor=pointer]:
