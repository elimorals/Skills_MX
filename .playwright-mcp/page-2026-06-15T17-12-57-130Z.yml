        - list [ref=e41]:
          - listitem [ref=e42]: Efectivo, Tarjeta de crédito o débito (excepto American Express) y Transferencia (SPEI).
        - paragraph [ref=e43]:
          - strong [ref=e44]: DESCARGA DEL RECIBO OFICIAL DE PAGO
        - paragraph [ref=e45]: La descarga del recibo oficial de los pagos efectuados en instituciones bancarias, tiendas de conveniencia y medios electrónicos (referenciados y SPEI), se realiza 24 hrs. posteriores al cierre de las operaciones diarias.
        - list [ref=e46]:
          - listitem [ref=e47]: "Para la descarga de pagos por Impuesto Predial, deberá capturar los siguientes datos: *Clave catastral *Año en que realizó el pago *Importe pagado (sin signos, comas o puntos)."
        - paragraph [ref=e48]:
          - text: Emitido el CFDI, se pone a su disposición de manera digital, ingresando al link
          - link "https://gestion.municipiodequeretaro.gob.mx/sello_digital" [ref=e49] [cursor=pointer]:
