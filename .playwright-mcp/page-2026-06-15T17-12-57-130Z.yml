          - text: .
        - paragraph [ref=e50]:
          - strong [ref=e51]: SOLICITUD DE CFDI
        - paragraph [ref=e52]:
          - text: Si requiere CFDI o el mismo presenta error, deberá solicitarlo a través del correo electrónico
          - link "facturaelectronica@municipiodequeretaro.gob.mx" [ref=e53] [cursor=pointer]:
            - /url: mailto:facturaelectronica@municipiodequeretaro.gob.mx
          - text: ", adjuntando en archivo digital lo siguiente:"
        - list [ref=e54]:
          - listitem [ref=e55]: Constancia de situación fiscal actualizada, legible y con régimen fiscal del contribuyente, recibo de pago oficial expedido por el Municipio de Querétaro, señalar uso de CFDI y teléfono.
        - paragraph [ref=e56]: Únicamente se emite CFDI a nombre del sujeto pasivo al que se generó el recibo.
        - paragraph [ref=e57]:
          - strong [ref=e58]: MARCO NORMATIVO
        - paragraph [ref=e59]: Art. 29 y 29-A del Código Fiscal Federal; Art. 36 al 40 del Reglamento del Código Fiscal Federal; y Capítulo 2.7.1.33 párrafo cuarto de la Resolución Miscelánea Fiscal 2022.
        - paragraph [ref=e60]:
          - strong [ref=e61]: AVISOS IMPORTANTES
        - list [ref=e62]:
          - listitem [ref=e63]: Banamex, Banorte, App, Web Municipio, Cajero Cerca, y QR, se aplican en línea.
          - listitem [ref=e64]: Se recomienda conservar la liquidación de pago o pase de caja; así como, el talón de pago que emite la institución bancaria o tienda de conveniencia, para cualquier aclaración.